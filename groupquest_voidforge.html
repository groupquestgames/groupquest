(()=>{'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d'),$=id=>document.getElementById(id);let W=innerWidth,H=innerHeight,DPR=1,scale=1,camX=0,camY=0;const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');const WORLD=2400;let state='menu',p,enemies=[],bullets=[],gems=[],particles=[],texts=[],hazards=[],boss=null,elapsed=0,spawnClock=0,shotClock=0,shake=0,flash=0,keys={},pointer=null,joy={x:0,y:0},usingTouch=false,last=0,anim=0,seed=0,upgradeQueue=0,muted=false,record={};try{record=JSON.parse(localStorage.getItem('gq_voidforge_v1')||'{}')}catch{};function save(){try{localStorage.setItem('gq_voidforge_v1',JSON.stringify(record))}catch{}}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();let audio;function sound(freq=440,dur=.07,type='sine',vol=.045){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.58),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}function overlay(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden');$('joy').style.display='none';$('dash').style.display='none'}function closeOverlay(){$('overlay').classList.add('hidden');$('joy').style.display='block';$('dash').style.display='block'}function menu(){state='menu';$('hud').style.display='none';overlay(`<div class="eye function start(){p={x:WORLD/2,y:WORLD/2,r:15,hp:100,maxHp:100,spd:220,damage:16,fire:1,range:440,projectiles:1,pierce:0,crit:.07,magnet:100,armor:0,regen:0,level:1,xp:0,need:12,kills:0,score:0,dash:0,inv:0,combo:0,comboT:0,weapons:{bolt:1},upgradeCount:0,revive:0,luck:0};enemies=[];bullets=[];gems=[];particles=[];texts=[];hazards=[];boss=null;elapsed=0;spawnClock=.4;shotClock=.1;shake=0;flash=0;upgradeQueue=0;state='play';$('hud').style.display='block';closeOverlay();updateHUD();sound(600,.16)}
const U=[['bolt','⚡','Плазмові постріли','Додатковий снаряд і швидша стрільба'],['orbit','🪐','Орбітальні клинки','Клинки обертаються навколо тебе'],['nova','💥','Нова','Періодична вибухова хвиля'],['lightning','🌩️','Ланцюгова блискавка','Уражає кількох найближчих ворогів'],['drone','🛸','Бойовий дрон','Супутник стріляє по ворогах'],['frost','❄️','Крижане поле','Сповільнює та пошкоджує ворогів'],['damage','🗡️','Сила удару','+25% до всіх пошкоджень'],['speed','👟','Адреналін','+14% швидкості руху'],['fire','🎯','Прискорення','+18% швидкості атаки'],['health','❤️','Життєва сила','+25 максимуму HP і лікування'],['magnet','🧲','Магніт','+55 до радіуса збору XP'],['armor','🛡️','Броня','-1.5 пошкодження від атак'],['regen','💚','Регенерація','Поступово відновлює здоров’я'],['crit','💎','Критичний удар','+9% шансу подвійного урону'],['pierce','🏹','Пробиття','Снаряди пробивають більше ворогів'],['heal','🩹','Швидка допомога','Відновити 45 HP зараз'],['revive','🪽','Другий шанс','Один раз воскреснути після смерті']];function options(){let pool=U.filter(u=>!['heal'].includes(u[0])||p.hp<p.maxHp*.7).filter(u=>u[0]!=='revive'||p.revive<1);pool.sort(()=>Math.random()-.5);let selected=pool.slice(0,3);if(p.level===2)selected=[U[1],U[2],U[5]];return selected}function levelUp(){state='upgrade';let choices=options();overlay(`<div class="eyebrow">✦ РІВЕНЬ ${p.level} · НОВА СИЛА</div><div class="title" style="font-size:38px">ОБЕРИ<br>ПОКРАЩЕННЯ</div><div class="subtitle">Кожне рішення змінює твій стиль бою. Створи власну комбінацію.</div><div class="grid" id="choices">${choices.map((u,i)=>`<div class="card" data-i="${i}"><div class="rarity">${p.weapons[u[0]]?'UPGRADE':'NEW POWER'}</div><div class="icon">${u[1]}</div><b>${u[2]}</b><small>${u[3]}</small></div>`).join('')}</div><div class="note">Гра призупинена, поки обираєш.</div>`);document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{apply(choices[+el.dataset.i][0]);state='play';closeOverlay();sound(750,.22,'triangle');if(upgradeQueue>0){upgradeQueue--;setTimeout(levelUp,80)}})}function apply(id){if(['bolt','orbit','nova','lightning','drone','frost'].includes(id)){p.weapons[id]=(p.weapons[id]||0)+1;if(id==='bolt'){p.projectiles=Math.min(5,1+Math.floor(p.weapons.bolt/2));p.fire*=1.07}}else if(id==='damage')p.damage*=1.25;else if(id==='speed')p.spd*=1.14;else if(id==='fire')p.fire*=1.18;else if(id==='health'){p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+40)}else if(id==='magnet')p.magnet+=55;else if(id==='armor')p.armor+=1.5;else if(id==='regen')p.regen+=.85;else if(id==='crit')p.crit=Math.min(.75,p.crit+.09);else if(id==='pierce')p.pierce++;else if(id==='heal')p.hp=Math.min(p.maxHp,p.hp+45);else if(id==='revive')p.revive++ ;p.upgradeCount++;toast('✦ СИЛУ ОТРИМАНО')}
function toast(s){let e=$('toast');e.textContent=s;e.style.opacity='1';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity='0',1250)}function spawnEnemy(type){let ang=rand(0,TAU),r=Math.max(W,H)*.72+80,ex=clamp(p.x+Math.cos(ang)*r,45,WORLD-45),ey=clamp(p.y+Math.sin(ang)*r,45,WORLD-45),wave=1+Math.floor(elapsed/40),types={grunt:{r:13,hp:30,spd:64,damage:10,score:10,col:'#ff567c',xp:3},runner:{r:10,hp:18,spd:120,damage:9,score:15,col:'#ffa95e',xp:4},tank:{r:23,hp:135,spd:39,damage:17,score:35,col:'#ad79ff',xp:9},shooter:{r:15,hp:55,spd:57,damage:12,score:25,col:'#7cbbff',xp:6},split:{r:16,hp:50,spd:76,damage:10,score:25,col:'#f68be4',xp:5},mini:{r:8,hp:12,spd:130,damage:6,score:5,col:'#ffb5dc',xp:1}};let a=types[type]||types.grunt;enemies.push({x:ex,y:ey,...a,hp:a.hp*(1+wave*.16),maxHp:a.hp*(1+wave*.16),spd:a.spd*(1+Math.min(.55,wave*.035)),type,shoot:rand(1,3),touch:0,slow:0,phase:rand(0,TAU)})}

function emit(x,y,color,n=8,power=90){for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(20,power);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.25,.7),max:.7,col:color,r:rand(1,4)})}}function damage(e,n){if(!e||e.hp<=0)return;let crit=Math.random()<p.crit,amount=n*(crit?2:1);e.hp-=amount;if(crit)texts.push({x:e.x,y:e.y-20,text:'CRIT '+Math.round(amount),life:.7,col:'#ffe477'});emit(e.x,e.y,e.col,crit?7:3,70);if(e.hp<=0)kill(e)}function kill(e){if(e.dead)return;e.dead=true;p.kills++;p.combo++;p.comboT=3;p.score+=Math.round(e.score*(1+Math.min(3,p.combo/18)));emit(e.x,e.y,e.col,e.type==='boss'?42:10,e.type==='boss'?220:100);let count=e.type==='boss'?18:e.type==='tank'?4:1;for(let i=0;i<count;i++)gems.push({x:e.x+rand(-25,25),y:e.y+rand(-25,25),v:e.xp/count,r:e.type==='boss'?6:4});if(e.type==='split'){for(let i=0;i<2;i++){spawnEnemy('mini');let m=enemies[enemies.length-1];m.x=e.x+rand(-16,16);m.y=e.y+rand(-16,16)}}if(e===boss){boss=null;p.hp=Math.min(p.maxHp,p.hp+35);p.score+=500;toast('👑 БОС ПЕРЕМОЖЕНИЙ! +500');sound(880,.35,'triangle');shake=13}}function gain(n){p.xp+=n;while(p.xp>=p.need){p.xp-=p.need;p.level++;p.need=Math.round(p.need*1.28+7);upgradeQueue++}if(upgradeQueue&&state==='play'){upgradeQueue--;levelUp()}}
function hurt(n){if(p.inv>0||state!=='play')return;let amount=Math.max(1,n-p.armor);p.hp-=amount;p.inv=.48;shake=9;flash=.14;emit(p.x,p.y,'#ff537d',12,125);sound(160,.16,'sawtooth');if(p.hp<=0){if(p.revive>0){p.revive--;p.hp=p.maxHp*.55;p.inv=3;toast('🪽 ДРУГИЙ ШАНС!');emit(p.x,p.y,'#8af8ff',40,230)}else gameOver()}}
function gameOver(){state='over';record.best=Math.max(record.best||0,p.score);record.time=Math.max(record.time||0,elapsed);record.runs=(record.runs||0)+1;record.kills=(record.kills||0)+p.kills;save();overlay(`<div class="eyebrow">ЗАБІГ ЗАВЕРШЕНО</div><div class="title">GAME<br>OVER</div><div class="badge">${p.score>=record.best?'🏆 НОВИЙ РЕКОРД!':'⚔️ АРЕНА ЧЕКАЄ НА РЕВАНШ'}</div><div class="info"><div><strong>${p.score}</strong><span>ОЧКИ</span></div><div><strong>${p.kills}</strong><span>ВОРОГІВ</span></div><div><strong>${fmt(elapsed)}</strong><span>ЧАС</span></div></div><div class="chips"><span class="chip">Рівень ${p.level}</span><span class="chip">Хвиля ${1+Math.floor(elapsed/40)}</span><span class="chip">Покращень ${p.upgradeCount}</span></div><button class="btn" id="again">⚡ ЩЕ ОДНА СПРОБА</button><button class="btn secondary" id="back">⌂ ГОЛОВНЕ МЕНЮ</button>`);$('again').onclick=start;$('back').onclick=menu;sound(220,.45,'triangle')}
function pause(){if(state==='play'){state='pause';overlay(`<div class="eyebrow">АРЕНА НА ПАУЗІ</div><div class="title" style="font-size:40px">ПАУЗА</div><div class="info"><div><strong>${p.score}</strong><span>ОЧКИ</span></div><div><strong>${p.kills}</strong><span>ВОРОГІВ</span></div><div><strong>${fmt(elapsed)}</strong><span>ЧАС</span></div></div><button class="btn" id="resume">▶ ПРОДОВЖИТИ</button><button class="btn secondary" id="quit">⌂ ЗАВЕРШИТИ ЗАБІГ</button>`);$('resume').onclick=()=>{state='play';closeOverlay()};$('quit').onclick=gameOver}}$('pause').onclick=pause;function dash(){if(state!=='play'||p.dash>0)return;let v=movement();if(!v.x&&!v.y){let target=nearest();if(target){let a=Math.atan2(target.y-p.y,target.x-p.x);v={x:-Math.cos(a),y:-Math.sin(a)}}else v={x:1,y:0}}p.x=clamp(p.x+v.x*145,22,WORLD-22);p.y=clamp(p.y+v.y*145,22,WORLD-22);p.dash=4.3;p.inv=.5;emit(p.x,p.y,'#a8f9ff',24,180);shake=6;sound(780,.15,'sawtooth')}function movement(){let x=joy.x,y=joy.y;if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;let len=Math.hypot(x,y);return len>1?{x:x/len,y:y/len}:{x,y}}function nearest(from=p,max=p.range){let best=null,d=max*max;for(let e of enemies){if(e.dead)continue;let v=(e.x-from.x)**2+(e.y-from.y)**2;if(v<d){d=v;best=e}}return best}function projectile(x,y,tx,ty,damageValue,spd=510,pierce=0,col='#79eaff',enemy=false){let a=Math.atan2(ty-y,tx-x);bullets.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:enemy?6:4,life:enemy?4:1.4,damage:damageValue,pierce,hit:new Set(),col,enemy})}
function update(dt){elapsed+=dt;seed+=dt;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.comboT-=dt;if(p.comboT<=0)p.combo=0;p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);let v=movement();p.x=clamp(p.x+v.x*p.spd*dt,20,WORLD-20);p.y=clamp(p.y+v.y*p.spd*dt,20,WORLD-20);spawnClock-=dt;let wave=1+Math.floor(elapsed/40);if(spawnClock<=0&&enemies.length<Math.min(130,35+wave*12)){let n=wave>=4&&Math.random()<.25?2:1;for(let i=0;i<n;i++){let z=Math.random();spawnEnemy(wave<2?(z<.78?'grunt':'runner'):z<.38?'grunt':z<.64?'runner':z<.79?'tank':z<.91?'shooter':'split')}spawnClock=Math.max(.16,1.02-wave*.075)*rand(.7,1.2)}if(Math.floor((elapsed-dt)/60)!==Math.floor(elapsed/60)&&elapsed>=60)summonBoss();shotClock-=dt;if(shotClock<=0){let e=nearest();if(e){for(let i=0;i<p.projectiles;i++){let a=Math.atan2(e.y-p.y,e.x-p.x)+(i-(p.projectiles-1)/2)*.15;projectile(p.x,p.y,p.x+Math.cos(a)*100,p.y+Math.sin(a)*100,p.damage,560,p.pierce)}sound(350,.035,'triangle',.012)}shotClock=.5/p.fire}
for(let e of enemies){if(e.dead)continue;e.phase+=dt;e.touch=Math.max(0,e.touch-dt);e.slow=Math.max(0,e.slow-dt);let d=dist(e,p),a=Math.atan2(p.y-e.y,p.x-e.x);if(e.type==='shooter'&&d<300){e.x-=Math.cos(a)*e.spd*dt*.4;e.y-=Math.sin(a)*e.spd*dt*.4}else{e.x+=Math.cos(a)*e.spd*(e.slow>0?.45:1)*dt;e.y+=Math.sin(a)*e.spd*(e.slow>0?.45:1)*dt}if(d<e.r+p.r&&e.touch<=0){hurt(e.damage);e.touch=.8}e.shoot-=dt;if((e.type==='shooter'||e.type==='boss')&&e.shoot<=0&&d<700){if(e.type==='boss'){for(let i=0;i<12;i++){let an=i*TAU/12+elapsed*.35;projectile(e.x,e.y,e.x+Math.cos(an)*100,e.y+Math.sin(an)*100,12,205,0,'#ff739e',true)}e.shoot=2.1}else{projectile(e.x,e.y,p.x,p.y,10,235,0,'#ffb15c',true);e.shoot=2.4}}}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.enemy){if(dist(b,p)<p.r+b.r){hurt(b.damage);b.life=0}}else for(let e of enemies){if(e.dead||b.hit.has(e))continue;if(dist(b,e)<e.r+b.r){b.hit.add(e);damage(e,b.damage);b.pierce--;if(b.pierce<0){b.life=0;break}}}}bullets=bullets.filter(b=>b.life>0);enemies=enemies.filter(e=>!e.dead);
if(p.weapons.orbit){let count=1+p.weapons.orbit*2;for(let i=0;i<count;i++){let a=elapsed*2.7+i*TAU/count,ox=p.x+Math.cos(a)*72,oy=p.y+Math.sin(a)*72;for(let e of enemies){if(e.touch>0)continue;if(Math.hypot(e.x-ox,e.y-oy)<e.r+12){damage(e,12+p.damage*.38);e.touch=.24}}}}
if(p.weapons.frost){let rad=105+p.weapons.frost*20;for(let e of enemies){if(dist(e,p)<rad){e.slow=.3;if(Math.random()<dt*3* p.weapons.frost)damage(e,3+p.weapons.frost*2)}}}
if(p.weapons.nova&&Math.floor((elapsed-dt)/(7/Math.sqrt(p.weapons.nova)))!==Math.floor(elapsed/(7/Math.sqrt(p.weapons.nova)))){let rad=150+p.weapons.nova*30;for(let e of enemies)if(dist(e,p)<rad)damage(e,35+p.damage*1.2);hazards.push({x:p.x,y:p.y,r:rad,life:.45,max:.45,col:'#a97bff'});emit(p.x,p.y,'#d6a3ff',24,200);shake=5;sound(100,.2,'sawtooth')}
if(p.weapons.lightning&&Math.floor((elapsed-dt)/(2.9/Math.sqrt(p.weapons.lightning)))!==Math.floor(elapsed/(2.9/Math.sqrt(p.weapons.lightning)))){let candidates=enemies.filter(e=>dist(e,p)<350).sort((a,b)=>dist(a,p)-dist(b,p)).slice(0,1+p.weapons.lightning*2),prev=p;for(let e of candidates){hazards.push({x:prev.x,y:prev.y,tx:e.x,ty:e.y,life:.22,max:.22,col:'#83faff',line:true});damage(e,18+p.damage*.75);prev=e}if(candidates.length)sound(990,.1,'sawtooth')}
if(p.weapons.drone){let count=p.weapons.drone;for(let i=0;i<count;i++){let a=elapsed*1.5+i*TAU/count,ox=p.x+Math.cos(a)*100,oy=p.y+Math.sin(a)*100;if(Math.floor((elapsed-dt)*1.8+i/count)!==Math.floor(elapsed*1.8+i/count)){let e=nearest({x:ox,y:oy},400);if(e)projectile(ox,oy,e.x,e.y,p.damage*.6,610,0,'#f0b4ff')}}}
for(let g of gems){let d=dist(g,p);if(d<p.magnet){let s=clamp(250+(p.magnet-d)*5,250,900);g.x+=(p.x-g.x)/Math.max(1,d)*s*dt;g.y+=(p.y-g.y)/Math.max(1,d)*s*dt}if(d<21){g.dead=true;gain(g.v);sound(750,.025,'sine',.012)}}gems=gems.filter(g=>!g.dead);for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.life-=dt}particles=particles.filter(q=>q.life>0);for(let t of texts){t.y-=35*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);for(let h of hazards)h.life-=dt;hazards=hazards.filter(h=>h.life>0);shake=Math.max(0,shake-dt*40);flash=Math.max(0,flash-dt);updateHUD()}
function updateHUD(){$('timer').textContent=fmt(elapsed);$('score').innerHTML=`${p.kills} KILLS<br>${p.score} SCORE`;$('hp').style.width=clamp(p.hp/p.maxHp*100,0,100)+'%';$('xp').style.width=clamp(p.xp/p.need*100,0,100)+'%';$('level').textContent='LVL '+p.level;$('wave').textContent='WAVE '+(1+Math.floor(elapsed/40));$('build').textContent='✦ '+Object.keys(p.weapons).length+' WEAPONS';$('dash').disabled=p.dash>0;$('dashLabel').textContent=p.dash>0?p.dash.toFixed(1)+'s':'READY';$('bossbar').style.display=boss?'block':'none';$('bossname').style.display=boss?'block':'none';if(boss)$('bossfill').style.width=clamp(boss.hp/boss.maxHp*100,0,100)+'%'}
function circle(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#070b1b');bg.addColorStop(.55,'#0e1431');bg.addColorStop(1,'#190f31');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let t=performance.now()/1000;if(state==='menu'){for(let i=0;i<75;i++){let x=(Math.sin(i*13.17)*.5+.5)*W,y=(Math.cos(i*7.19)*.5+.5)*H;circle(x,y,1+Math.sin(t+i)*.7,'#9bb5ff88')}return}if(!p)return;camX=clamp(p.x-W/2,0,Math.max(0,WORLD-W));camY=clamp(p.y-H/2,0,Math.max(0,WORLD-H));ctx.save();ctx.translate(-camX+rand(-shake,shake),-camY+rand(-shake,shake));ctx.strokeStyle='#7e9cff10';ctx.lineWidth=1;let grid=64;for(let x=Math.floor(camX/grid)*grid;x<camX+W+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,camY-40);ctx.lineTo(x,camY+H+40);ctx.stroke()}for(let y=Math.floor(camY/grid)*grid;y<camY+H+grid;y+=grid){ctx.beginPath();ctx.moveTo(camX-40,y);ctx.lineTo(camX+W+40,y);ctx.stroke()}ctx.strokeStyle='#88d9ff66';ctx.lineWidth=5;ctx.strokeRect(0,0,WORLD,WORLD);
for(let i=0;i<40;i++){let x=(i*673+237)%WORLD,y=(i*1139+419)%WORLD;if(Math.abs(x-p.x)<W&&Math.abs(y-p.y)<H){circle(x,y,2,'#698bd455');circle(x,y,12,'#698bd408')}}for(let g of gems){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(t*2);ctx.fillStyle='#71eaff';ctx.shadowColor='#64dfff';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(0,-g.r*1.6);ctx.lineTo(g.r,0);ctx.lineTo(0,g.r*1.6);ctx.lineTo(-g.r,0);ctx.closePath();ctx.fill();ctx.restore()}
for(let h of hazards){ctx.save();ctx.globalAlpha=h.life/h.max;if(h.line){ctx.strokeStyle=h.col;ctx.shadowColor=h.col;ctx.shadowBlur=20;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(h.tx,h.ty);ctx.stroke()}else{ctx.strokeStyle=h.col;ctx.lineWidth=6;ctx.shadowColor=h.col;ctx.shadowBlur=25;ctx.beginPath();ctx.arc(h.x,h.y,h.r*(1-h.life/h.max*.6),0,TAU);ctx.stroke()}ctx.restore()}
if(p.weapons.frost){let rad=105+p.weapons.frost*20;let gr=ctx.createRadialGradient(p.x,p.y,10,p.x,p.y,rad);gr.addColorStop(0,'#6fd7ff04');gr.addColorStop(.85,'#6fd7ff0a');gr.addColorStop(1,'#75e5ff36');circle(p.x,p.y,rad,gr)}for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.phase*.45);ctx.shadowColor=e.col;ctx.shadowBlur=e.type==='boss'?32:12;circle(0,0,e.r,e.col);ctx.shadowBlur=0;circle(0,0,e.r*.65,'#16142f');ctx.strokeStyle=e.col;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<(e.type==='boss'?8:5);i++){let a=i*TAU/(e.type==='boss'?8:5),r=e.r*.52;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.stroke();ctx.restore();if(e.hp<e.maxHp){ctx.fillStyle='#12142b';ctx.fillRect(e.x-e.r,e.y-e.r-12,e.r*2,4);ctx.fillStyle=e.col;ctx.fillRect(e.x-e.r,e.y-e.r-12,e.r*2*clamp(e.hp/e.maxHp,0,1),4)}}
for(let b of bullets){ctx.save();ctx.shadowColor=b.col;ctx.shadowBlur=15;circle(b.x,b.y,b.r,b.col);ctx.restore()}if(p.weapons.orbit){let count=1+p.weapons.orbit*2;for(let i=0;i<count;i++){let a=elapsed*2.7+i*TAU/count,x=p.x+Math.cos(a)*72,y=p.y+Math.sin(a)*72;ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/4);ctx.shadowColor='#b79cff';ctx.shadowBlur=20;ctx.fillStyle='#d5c5ff';ctx.fillRect(-9,-9,18,18);ctx.restore()}}if(p.weapons.drone){for(let i=0;i<p.weapons.drone;i++){let a=elapsed*1.5+i*TAU/p.weapons.drone;ctx.save();ctx.translate(p.x+Math.cos(a)*100,p.y+Math.sin(a)*100);ctx.shadowColor='#f7adff';ctx.shadowBlur=17;circle(0,0,9,'#f2a9ff');circle(0,0,4,'#25244d');ctx.restore()}}
ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=p.inv>0&&Math.sin(elapsed*28)>0?.45:1;ctx.shadowColor='#7be9ff';ctx.shadowBlur=26;circle(0,0,p.r+5,'#67dfff25');circle(0,0,p.r,'#a3f8ff');ctx.shadowBlur=0;circle(0,0,9,'#234579');circle(0,0,4,'#ffffff');ctx.restore();for(let q of particles){ctx.globalAlpha=clamp(q.life/q.max,0,1);circle(q.x,q.y,q.r,q.col)}ctx.globalAlpha=1;for(let tx of texts){ctx.globalAlpha=clamp(tx.life/.7,0,1);ctx.fillStyle=tx.col;ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(tx.text,tx.x,tx.y)}ctx.globalAlpha=1;ctx.restore();if(flash>0){ctx.fillStyle=`rgba(255,50,100,${flash*.65})`;ctx.fillRect(0,0,W,H)}if(state==='play'&&p.combo>4){ctx.fillStyle='#ffcb83';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.fillText('🔥 '+p.combo+' COMBO',W/2,104)}}
function frame(ms){let dt=Math.min(.033,(ms-last)/1000||.016);last=ms;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function joyMove(e){if(!pointer||e.pointerId!==pointer.id)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y,l=Math.hypot(dx,dy),m=Math.min(1,l/52);joy.x=l?dx/l*m:0;joy.y=l?dy/l*m:0;$('nub').style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}addEventListener('pointerdown',e=>{if(state!=='play')return;if(e.target.closest('button'))return;if(e.clientX<W*.68){pointer={id:e.pointerId,x:e.clientX,y:e.clientY};joyMove(e);$('joy').style.left=(clamp(e.clientX-63,5,W-131))+'px';$('joy').style.top=(clamp(e.clientY-63,95,H-140))+'px';$('joy').style.bottom='auto';usingTouch=true}}, {passive:true});addEventListener('pointermove',joyMove,{passive:true});function endJoy(e){if(pointer&&e.pointerId===pointer.id){pointer=null;joy.x=joy.y=0;$('nub').style.transform='translate(0,0)'}}addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);$('dash').onclick=dash;addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!e.repeat)dash();if(e.code==='Escape'&&state==='play')pause()});addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});menu();})();
