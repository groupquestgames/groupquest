function fetchJSON(k){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function storeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const validState=s=>s && s.version===1 && s.run && s.run.deck && Array.isArray(s.run.deck) && ['menu','map','battle','reward','relicReward','camp','shop','event','victory','defeat'].includes(s.screen);
function load(){const x=fetchJSON(META_KEY);if(x && typeof x==='object'){meta={...meta,...x,perks:{...meta.perks,...(x.perks||{})}}}const saved=fetchJSON(SAVE_KEY);if(validState(saved))state=saved;else state={version:1,screen:'menu',run:null,battle:null,shop:null,reward:null,event:null};if(state.screen==='battle'&&!state.battle)state.screen='map';}
function save(){storeJSON(SAVE_KEY,state);storeJSON(META_KEY,meta)}
function has(r){return !!(state.run&&state.run.relics.includes(r))}
function activeRun(){return !!state.run && !['menu','victory','defeat'].includes(state.screen)}
function B(){return state.battle}
function R(){return state.run}
function addCard(id,up=false){R().deck.push({id,up,uid:uid()})}
function gainRelic(id){if(has(id))return;R().relics.push(id);if(id==='hope'){R().maxHp+=14;heal(14)}sfx('chime');note(`Relic acquired: ${RELICS[id].name}`)}
function newRun(){meta.runs++;const perks=meta.perks;state={version:1,screen:'map',run:{act:1,stage:0,hp:90+perks.hp*4,maxHp:90+perks.hp*4,gold:80+perks.gold*15,relics:[],potions:1+(perks.potion>0?1:0),deck:[],score:0,kills:0,nodesCleared:0,usedPhoenix:false,currentNode:null,history:[],flags:{}},battle:null,shop:null,reward:null,event:null};for(let i=0;i<5;i++)addCard('strike');for(let i=0;i<4;i++)addCard('guard');addCard('focus');addCard('surge');addCard('dash');selection=null;meta.bestAct=Math.max(meta.bestAct,1);save();render();}
function routeOptions(){const stage=R().stage,act=R().act;if(stage===0)return ['battle'];if(stage===1)return ['battle','event'];if(stage===2)return ['battle','elite'];if(stage===3)return ['camp','shop'];if(stage===4)return ['battle','event'];if(stage===5)return ['battle','elite','shop'];return ['boss']}
const routeInfo={battle:['⚔','Skirmish','An enemy squad. Earn Gold and discover a new card.'],elite:['♛','Elite Hunt','A tougher foe. Win a rare relic and extra Gold.'],event:['✧','Uncharted Event','A risky choice with an unexpected reward.'],camp:['♨','Hearth','Restore health or upgrade a card.'],shop:['◈','Wandering Merchant','Buy cards, healing and powerful relics.'],boss:['✹','Act Guardian','Defeat the guardian to enter the next act. If you have no tonics, take one into battle.']};
function pickEncounter(type){const act=R().act,stage=R().stage;
 if(type==='boss')return [[null,'warden','matriarch','archon'][act]];
 if(type==='elite')return [[null,'elite1','elite2','elite3'][act]];
 if(act===1){return stage===0?['scout']:pick([['scout','wisp'],['knight'],['wisp','scout'],['acolyte']])}
 if(act===2)return pick([['knight','acolyte'],['beast'],['leech','wisp'],['duelist']]);
 return pick([['beast','seer'],['duelist','leech'],['knight','seer'],['beast','duelist']]);}
function chooseRoute(type){if(!routeOptions().includes(type))return;if(type==='boss'&&!R().potions)R().potions=1;
  R().currentNode=type;R().history.push({act:R().act,stage:R().stage,type});selection=null;if(['battle','elite','boss'].includes(type)){startBattle(type)}else if(type==='camp'){state.screen='camp'}else if(type==='shop'){setupShop();state.screen='shop'}else{setupEvent();state.screen='event'}save();render()}
function makeEnemy(id,act){const x=FOES[id],scale=x.boss||x.elite?1:1+.15*(act-1);const h=Math.round(x.hp*scale);return {uid:uid(),id,hp:h,maxHp:h,block:0,str:0,weak:0,vuln:0,poison:0,burn:0,turn:0,intent:null};}
function currentIntent(e){const x=FOES[e.id],i=(e.turn+R().act-1)%x.actions.length;const base=x.actions[i];const mult=x.boss||x.elite?1:1+.1*(R().act-1);return {kind:base[0],amount:Math.round(base[1]*mult), index:i};}
function startBattle(type){const ids=pickEncounter(type);const b={enemies:ids.map(id=>makeEnemy(id,R().act)),player:{block:0,str:0,weak:0,vuln:0,poison:0,armor:0,thorns:0,tempThorns:0,regen:0,echo:0},energy:3,maxEnergy:3,hand:[],drawPile:shuffle(R().deck.map(c=>({...c}))),discardPile:[],exhaustPile:[],turn:0,attackCount:0,firstDraw:0,lastLog:'Select a card to play. Read enemy intentions first.',firstAttack:false,ended:false};if(R().act===1&&R().stage===0){
  // The tutorial hand offers both an attack and a block.
  for(const id of ['strike','guard']){
    const index=b.drawPile.findIndex(card=>card.id===id);
    if(index>=0)b.drawPile.push(b.drawPile.splice(index,1)[0]);
  }
}
state.battle=b;state.screen='battle';b.enemies.forEach(e=>e.intent=currentIntent(e));for(const id of R().relics){if(RELICS[id]?.apply)RELICS[id].apply(b)}startTurn(true);save()}
function draw(n){const b=B();if(!b)return;for(let i=0;i<n&&b.hand.length<10;i++){if(b.drawPile.length===0){if(!b.discardPile.length)break;b.drawPile=shuffle(b.discardPile);b.discardPile=[];}b.hand.push(b.drawPile.pop())}}
function block(n){const b=B();b.player.block=Math.max(0,b.player.block+Math.max(0,Math.floor(n)));}
function heal(n){const r=R();if(!r)return;const before=r.hp;r.hp=clamp(r.hp+Math.max(0,Math.floor(n)),0,r.maxHp);return r.hp-before}
function loseHp(n,ignoreBlock=false){const b=B(),r=R();if(!r)return;let dmg=Math.max(0,Math.round(n));if(!ignoreBlock&&b){const soak=Math.min(b.player.block,dmg);b.player.block-=soak;dmg-=soak}r.hp-=dmg;if(r.hp<=0){if(has('phoenix')&&!r.usedPhoenix){r.usedPhoenix=true;r.hp=18;note('Phoenix Feather saved you!')}else{r.hp=0;defeat()}}return dmg}
function playerDmg(base, opts={}){const b=B();let x=Math.max(0,base+b.player.str+(has('blade')?2:0));if(b.player.weak>0)x*=.75;if(!b.firstAttack&&b.player.echo>0)x*=1+b.player.echo;return Math.max(1,Math.floor(x))}
function hit(e,base,opts={}){if(!e||e.hp<=0)return 0;const b=B();let dmg=playerDmg(base,opts);if(e.vuln>0)dmg=Math.floor(dmg*1.5);if(!opts.pierce){const soak=Math.min(e.block,dmg);e.block-=soak;dmg-=soak}e.hp=Math.max(0,e.hp-dmg);if(e.hp===0){R().kills++;meta.kills++;}return dmg}
function allEnemies(fn){for(const e of B().enemies){if(e.hp>0)fn(e)}}
function startTurn(first=false){const b=B();b.turn++;b.energy=b.maxEnergy+b.player.regen;b.player.block=b.player.armor;b.player.tempThorns=0;b.attackCount=0;b.firstAttack=false;if(!first){if(b.player.poison>0){loseHp(b.player.poison,true);b.player.poison=Math.max(0,b.player.poison-1)}if(state.screen==='defeat')return;}draw(5+(first?b.firstDraw:0));b.enemies.forEach(e=>{if(e.hp>0)e.intent=currentIntent(e)});b.lastLog=`Turn ${b.turn} — Plan your moves. `;save()}
function enemyEffect(e){if(state.screen!=='battle'||e.hp<=0)return;const b=B(),p=b.player,action=e.intent;const kind=action.kind, n=action.amount;const mult=e.weak>0?.75:1;const amount=Math.max(0,Math.floor((n+e.str)*mult*(p.vuln>0?1.5:1)));
 if(kind==='hit'||kind==='charge'){const damage=loseHp(amount);if(damage>0&&(p.thorns+p.tempThorns)>0){const returned=p.thorns+p.tempThorns;e.hp=Math.max(0,e.hp-returned);if(e.hp===0){R().kills++;meta.kills++;}} b.lastLog=`${FOES[e.id].name} attacks for ${amount}.`}
 else if(kind==='guard'){e.block+=n;b.lastLog=`${FOES[e.id].name} raises ${n} Block.`}
 else if(kind==='hex'){p.weak+=n;b.lastLog=`${FOES[e.id].name} applies ${n} Weak.`}
 else if(kind==='poison'){loseHp(Math.max(1,n-3));if(state.screen!=='defeat')p.poison+=2;b.lastLog=`${FOES[e.id].name} inflicts Poison.`}
 else if(kind==='power'){e.str+=n;b.lastLog=`${FOES[e.id].name} gains ${n} Strength.`}
}
function checkWin(){if(state.screen!=='battle')return true;const b=B();if(b.enemies.every(e=>e.hp<=0)){winBattle();return true}return false}
function playCard(index){if(state.screen!=='battle')return;const b=B();const card=b.hand[index];if(!card)return;const def=C[card.id];if(!def||b.energy<def.cost){note('Not enough Energy');sfx('fail');return}const target=b.enemies.find(e=>e.uid===selection&&e.hp>0)||b.enemies.find(e=>e.hp>0);if(!target)return;const cardType=def.type;
 b.energy-=def.cost;b.hand.splice(index,1);if(cardType==='attack')b.attackCount++;if(cardType==='skill'&&has('armor'))block(2);
 try{def.play(card.up,target)}catch(err){console.error(err);b.energy+=def.cost;b.hand.splice(index,0,card);note('Could not play card');render();return}
 if(cardType==='attack')b.firstAttack=true;
 if(def.exhaust)b.exhaustPile.push(card);else b.discardPile.push(card);
 b.lastLog=`Played ${def.name}${card.up?' +':''}.`;
 if(checkWin()){sfx('win');return}
 sfx(cardType==='attack'?'hit':'card');save();render(true);
}
function endTurn(){if(state.screen!=='battle')return;const b=B();b.discardPile.push(...b.hand);b.hand=[];b.energy=0;
 for(const e of b.enemies){if(e.hp<=0)continue;if(e.poison>0){e.hp=Math.max(0,e.hp-e.poison);e.poison=Math.max(0,e.poison-1);if(e.hp===0){R().kills++;meta.kills++;}}if(e.hp>0&&e.burn>0){e.hp=Math.max(0,e.hp-e.burn);e.burn=Math.max(0,e.burn-1);if(e.hp===0){R().kills++;meta.kills++;}}}
 if(checkWin())return;
 for(const e of b.enemies){if(e.hp<=0)continue;enemyEffect(e);if(state.screen==='defeat'){sfx('fail');return}e.turn++;if(e.weak>0)e.weak--;if(e.vuln>0)e.vuln--;e.block=0;}
 if(b.player.weak>0)b.player.weak--;
 if(b.player.vuln>0)b.player.vuln--;
 if(checkWin())return;
 startTurn();sfx('turn');save();render(true);
}
function potion(){if(state.screen!=='battle'||R().potions<=0)return;R().potions--;const gained=heal(19);B().lastLog=`Drank healing tonic: +${gained} HP.`;note(`Restored ${gained} HP`);sfx('chime');save();render(true)}
function winBattle(){const b=B(),r=R(),type=r.currentNode;const base=type==='boss'?85:type==='elite'?52:rand(24,33);const gold=Math.ceil(base*(has('coin')?1.3:1));r.gold+=gold;r.score+=Math.round(100+(b.turn<=4?40:0)+(type==='elite'?180:0)+(type==='boss'?450:0));const recovered=heal(type==='boss'?20:type==='elite'?12:9)+(has('blessing')?heal(5):0);if(Math.random()<.28&&r.potions<3)r.potions++;r.nodesCleared++;meta.rooms++;const rareChance=type==='elite'||type==='boss'?.28:.09;
 if(type==='boss'){state.reward={type, gold, recovered, cards:[], relics:offerRelics(3), turn:b.turn, hp:r.hp};state.screen='relicReward'}
 else{const count=has('map')?4:3;state.reward={type,gold,recovered,cards:offerCards(count,rareChance),relics:type==='elite'?offerRelics(3):[],turn:b.turn,hp:r.hp,selectedCard:false};state.screen='reward'}
 state.battle=null;selection=null;save();render();sfx('win');}
function poolForCards(){return Object.keys(C).filter(id=>!['starter'].includes(C[id].rarity))}
function offerCards(n=3,rareChance=.09){const pool=poolForCards(),result=[];for(let i=0;i<n;i++){const rarity=Math.random()<rareChance?'rare':Math.random()<.4?'uncommon':'common';let options=pool.filter(id=>C[id].rarity===rarity&&!result.includes(id));if(!options.length)options=pool.filter(id=>!result.includes(id));result.push(pick(options));}return result}
function offerRelics(n=3){return shuffle(Object.keys(RELICS).filter(id=>!has(id))).slice(0,n)}
function acceptCard(id){if(state.screen!=='reward'||!state.reward.cards.includes(id))return;addCard(id);finishReward()}
function skipCard(){if(state.screen!=='reward')return;R().gold+=12;finishReward()}
function finishReward(){if(state.reward.relics.length){state.reward.selectedCard=true;state.screen='relicReward'}else{state.reward=null;completeNode()}save();render();}
function acceptRelic(id){if(state.screen!=='relicReward'||!state.reward?.relics.includes(id))return;gainRelic(id);state.reward=null;completeNode();}
function completeNode(){const r=R();if(!r)return;r.currentNode=null;r.stage++;if(r.stage>=NODES){r.stage=0;r.act++;if(r.act>MAX_ACT){victory();return}meta.bestAct=Math.max(meta.bestAct,r.act);const extra=18;heal(extra);note(`Act ${r.act} unlocked · +${extra} HP`)}state.shop=null;state.event=null;state.screen='map';save();render()}
function defeat(){state.screen='defeat';meta.bestAct=Math.max(meta.bestAct,R().act);const gain=Math.max(4,Math.floor(R().score/140)+2*R().act);meta.sigils+=gain;R().earnedSigils=gain;state.battle=null;save();render()}
function victory(){state.screen='victory';meta.wins++;meta.bestAct=3;const gain=25+Math.floor(R().score/100);meta.sigils+=gain;R().earnedSigils=gain;save();render();sfx('win')}
function setupShop(){const r=R();state.shop={cards:offerCards(3,.24).map((id,i)=>({id,price:50+i*11,bought:false})),relics:offerRelics(2).map((id,i)=>({id,price:115+20*i,bought:false})),healing:{price:35,bought:false}}}
function buyShop(kind,i){if(state.screen!=='shop')return;let item;if(kind==='healing')item=state.shop.healing;else item=state.shop[kind]?.[i];if(!item||item.bought||R().gold<item.price)return;R().gold-=item.price;item.bought=true;if(kind==='cards')addCard(item.id);else if(kind==='relics')gainRelic(item.id);else heal(22);sfx('chime');save();render()}
function setupEvent(){state.event={id:pick(['altar','traveler','vault','wellspring'])};}
function eventChoice(choice){if(state.screen!=='event')return;const id=state.event.id;if(choice===0){if(id==='altar'){R().maxHp+=7;heal(7)}else if(id==='traveler'){R().gold+=70;loseEventHealth(10)}else if(id==='vault'){const r=offerRelics(1)[0];if(r)gainRelic(r);else R().gold+=65}else if(id==='wellspring'){heal(26)}}else{if(id==='altar'){R().gold+=40}else if(id==='traveler'){heal(13)}else if(id==='vault'){R().gold+=65}else if(id==='wellspring'){R().gold+=45}}sfx('chime');completeNode()}
function loseEventHealth(n){R().hp=Math.max(1,R().hp-n)}
function campHeal(){if(state.screen!=='camp')return;heal(25);completeNode()}
function campUpgrade(){if(state.screen!=='camp')return;modal='upgrade';renderModal()}
function upgradeCard(index){if(state.screen!=='camp'||modal!=='upgrade')return;const card=R().deck[index];if(!card||card.up)return;card.up=true;modal=null;completeNode()}
const perks={hp:{name:'Vitality',sym:'♥',desc:'+4 starting maximum HP per level.',cost:[14,30,55],max:3},gold:{name:'Provisioning',sym:'✦',desc:'+15 starting Gold per level.',cost:[14,30,55],max:3},potion:{name:'Field Kit',sym:'♨',desc:'Begin each run with an extra healing potion.',cost:[35],max:1}};
function buyPerk(id){const p=perks[id],level=meta.perks[id]||0;if(!p||level>=p.max||meta.sigils<p.cost[level])return;meta.sigils-=p.cost[level];meta.perks[id]++;sfx('chime');save();render()}
function restartAfterEnd(){state.screen='menu';state.run=null;state.battle=null;state.shop=null;state.reward=null;state.event=null;save();render()}
function goMenu(){if(activeRun()){state.screen='menu';save();render()}else{state.screen='menu';render()}}
function resume(){if(state.run&&R().currentNode){if(state.battle)state.screen='battle';else if(state.reward?.relics?.length&&state.reward.cards?.length===0)state.screen='relicReward';else if(state.reward)state.screen=state.reward.selectedCard?'relicReward':'reward';else if(state.shop)state.screen='shop';else if(state.event)state.screen='event';else state.screen=R().currentNode==='camp'?'camp':'map';}else if(state.run){state.screen='map'}else return;save();render()}

function renderCard(card,i,mode='hand'){const d=C[card.id];if(!d)return '';const afford=mode==='hand' && B().energy<d.cost;return `<button type="button" class="card ${d.type} ${mode!=='hand'?'suggest':''}" data-action="${mode==='hand'?'card':mode==='reward'?'reward-card':'none'}" data-index="${i}" ${mode==='hand'&&afford?'disabled':''} aria-label="${esc(d.name)}. ${esc(d.desc(card.up))}. Cost ${d.cost}">
<span class="cost">${d.cost}</span>${card.up?'<span class="upstar">★</span>':''}<span class="cardicon" aria-hidden="true">${esc(d.icon)}</span><span class="cardname">${esc(d.name)}${card.up?' +':''}</span><span class="carddesc">${esc(d.desc(card.up))}</span><span class="cardfoot">${esc(d.rarity)} · ${esc(d.type)}</span></button>`}
function renderHeader(){let chip='A TACTICAL ADVENTURE';if(R()&&activeRun())chip=`ACT ${R().act} / 3 · ROOM ${R().stage+1} / 7`;return `<header class="top"><div class="brand"><div class="mark" aria-hidden="true">✧</div><div><small>GROUPQUEST ORIGINAL</small><strong>ECHOBOUND</strong></div></div><div class="topright"><span class="chapter">${chip}</span><button type="button" data-action="sound" class="iconbtn" title="Toggle sound" aria-label="Toggle sound">${meta.muted?'♪̸':'♪'}</button><button type="button" data-action="help" class="iconbtn" title="How to play" aria-label="How to play">?</button></div></header>`}
function renderMenu(){const resumable=!!R()&&R().hp>0&&R().act<=3;return `<section class="screen"><div class="hero"><div class="hero-content"><div class="eyebrow">✦ CARDS OF THE RIFT</div><h1 class="title">One deck.<br>Three realms.<br>Endless choices.</h1><p class="subtitle">A handcrafted tactical roguelike. Build devastating combos, outsmart telegraphed enemies, earn relics and fight your way through three acts.</p><div class="row"><button type="button" class="btn" data-action="${resumable?'resume':'new'}">${resumable?'▶ Continue expedition':'▶ Begin expedition'} →</button><button type="button" class="btn ghost" data-action="archive">✧ Archives</button></div><div class="features"><span class="feature">⚔ Turn-based battles</span><span class="feature">✦ 32 cards</span><span class="feature">◷ Auto-saves</span></div></div></div><div class="statgrid"><div class="stat"><b>${meta.runs||0}</b><span>Expeditions</span></div><div class="stat"><b>${meta.bestAct||1}/3</b><span>Furthest act</span></div><div class="stat"><b>${meta.wins||0}</b><span>Victories</span></div></div><div class="sectiontop"><h2>How you survive</h2><small>Easy to learn · Hard to master</small></div><div class="instruction"><div class="inst"><span class="num">01</span><b>Play your hand</b><p>Use Energy to play cards. Attacks, defense, poison and powerful combos.</p></div><div class="inst"><span class="num">02</span><b>Read intentions</b><p>Every enemy reveals its next move. Adapt before ending your turn.</p></div><div class="inst"><span class="num">03</span><b>Build your legend</b><p>Choose routes, earn cards, discover relics, upgrade your deck.</p></div></div>${resumable?`<div class="row" style="margin-top:17px"><span class="micro">You have a saved expedition.</span><button type="button" class="btn small danger" data-action="confirm-new">Start fresh instead</button></div>`:`<div class="row" style="margin-top:17px"><span class="micro">Progress saves locally on this device. No download. No account required.</span></div>`}</section>`}

function renderMap(){const opts=routeOptions();return `<section class="screen">${progress()}<div class="maphead"><div><div class="eyebrow">${esc(AREAS[R().act-1])}</div><h1 class="title">Choose your path.</h1><p class="subtitle">Every choice shapes your deck. Harder fights offer greater rewards.</p></div><button type="button" class="btn ghost small" data-action="menu">⌂ Menu</button></div>${renderHud()}<div class="routes">${opts.map(t=>{const q=routeInfo[t];return `<button type="button" class="route ${t}" data-action="route" data-type="${t}"><span class="routeicon">${q[0]}</span><span><h3>${q[1]}</h3><p>${q[2]}</p></span><span class="arrow">›</span></button>`}).join('')}</div><div class="combatfooter"><span class="micro">✧ Autosaved after every decision</span><button type="button" class="btn ghost small" data-action="deck">☷ Your deck</button></div></section>`}
function intentLabel(e){const i=e.intent;if(!i)return '—';const n=i.amount;const labels={hit:`⚔ ATTACK ${Math.max(0,n+e.str)}`,charge:`⚡ HEAVY ${Math.max(0,n+e.str)}`,guard:`⬡ BLOCK ${n}`,hex:`◈ WEAK ${n}`,poison:`☣ HIT ${Math.max(1,n-3)} · POISON +2`,power:`✦ STRENGTH +${n}`};return labels[i.kind]||i.kind}
function enemyBadge(e){return [e.block>0?`⬡${e.block}`:'',e.str>0?`✦${e.str}`:'',e.poison>0?`☣${e.poison}`:'',e.burn>0?`♨${e.burn}`:'',e.weak>0?`W${e.weak}`:'',e.vuln>0?`V${e.vuln}`:''].filter(Boolean).map(x=>`<span class="statusbadge">${x}</span>`).join('')}
function playerBadges(){const p=B().player;return [p.block>0?`⬡ Block ${p.block}`:'',p.str>0?`✦ Strength ${p.str}`:'',p.weak>0?`⚠ Weak ${p.weak}`:'',p.vuln>0?`⚠ Vulnerable ${p.vuln}`:'',p.poison>0?`☣ Poison ${p.poison}`:'',p.armor>0?`◈ Armor ${p.armor}`:'',p.thorns+p.tempThorns>0?`❀ Thorns ${p.thorns+p.tempThorns}`:''].filter(Boolean).map(x=>`<span class="statusbadge">${x}</span>`).join('')}
function renderBattle(){const b=B(),r=R(),foes=b.enemies.filter(e=>e.hp>0);return `<section class="screen"><div class="progresspanel"><strong>ACT ${r.act} · ${r.stage+1}/7</strong><div class="line"><span class="micro">TURN ${b.turn} · ${esc(AREAS[r.act-1])}</span></div><button type="button" class="btn ghost small" data-action="pause">Ⅱ Pause</button></div><div class="arena"><div class="arenatop"><div class="arenahead">${r.currentNode==='boss'?'✹ BOSS ENCOUNTER':r.currentNode==='elite'?'♛ ELITE ENCOUNTER':'⚔ ENCOUNTER'}</div><span class="micro">Tap enemy to target</span></div><div class="enemies">${foes.map(e=>{const f=FOES[e.id],sel=(!selection&&e===foes[0])||selection===e.uid;return `<button type="button" class="enemy ${sel?'selected':''}" data-action="target" data-id="${esc(e.uid)}" aria-label="Target ${esc(f.name)}, ${e.hp} hit points, next action ${esc(intentLabel(e))}">${sel?'<span class="target">TARGET</span>':''}<div class="enemyart ${f.cls}" aria-hidden="true">${f.sym}</div><div class="enemyname">${esc(f.name)}</div><div class="hpmeter"><div class="hpfill" style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></div></div><div class="hptext">${e.hp} / ${e.maxHp} HP</div><span class="intent ${['hit','charge','poison'].includes(e.intent.kind)?'attack':['guard','power'].includes(e.intent.kind)?'buff':''}">${esc(intentLabel(e))}</span><div class="statusline">${enemyBadge(e)}</div></button>`}).join('')}</div></div><div class="playerpanel"><div><div class="playername">✧ The Wanderer <span class="labeltag">YOU</span></div><div class="healthtrack"><div style="width:${100*r.hp/r.maxHp}%"></div></div><div class="playerinfo"><strong>♥ ${r.hp} / ${r.maxHp} HP</strong>${playerBadges()}</div></div><div class="energy"><span>${b.energy}</span><small>ENERGY</small></div></div><div class="deckbar"><h2>Your hand <small class="micro">${b.hand.length} cards</small></h2><span class="deckcount">DRAW ${b.drawPile.length} · DISCARD ${b.discardPile.length}</span></div><div class="hand" id="hand">${b.hand.map((c,i)=>renderCard(c,i)).join('')||'<div class="notice" style="width:100%">No cards in hand. End your turn to draw again.</div>'}</div><div class="actions"><button class="btn secondary" type="button" data-action="potion" ${r.potions<1||r.hp===r.maxHp?'disabled':''}>♨ TONIC ×${r.potions} <small>+19 HP</small></button><button class="btn primary" type="button" data-action="end-turn">END TURN →</button></div>${b.turn===1?`<div class="tip">💡 Enemies show their NEXT move. Play cards by tapping them. Your Block expires each turn. Tonic healing is free.</div>`:''}<div class="combatfooter"><button type="button" class="btn ghost small" data-action="deck">☷ Deck & relics</button><span class="micro">Every action autosaves · Safe to leave</span></div><div class="logline" aria-live="polite">${esc(b.lastLog)}</div></section>`}

const events={altar:{icon:'✧',title:'The Ancient Altar',desc:'A stone inscribed with a promise of strength. A tribute of time, or a gift of gold?',options:[['Offer a prayer','Gain 7 maximum HP and heal 7.'],['Take the offering','Gain 40 Gold.']]},traveler:{icon:'♙',title:'The Lost Traveler',desc:'A stranger sits beside the road. Their pack is heavy, but their eyes are kind.',options:[['Accept the bargain','Gain 70 Gold. Lose 10 HP (cannot kill).'],['Share provisions','Restore 13 HP.']]},vault:{icon:'◇',title:'The Forgotten Vault',desc:'A sealed chamber opens to your touch. An ancient relic floats above the dust.',options:[['Claim the relic','Receive a random relic.'],['Take the coins','Gain 65 Gold.']]},wellspring:{icon:'♨',title:'The Quiet Spring',desc:'A luminous spring hums in the stones. Rest for a time, or pocket its treasures.',options:[['Drink deeply','Restore 26 HP.'],['Gather coins','Gain 45 Gold.']]}};
function renderEvent(){const q=events[state.event.id];return `<section class="screen">${progress()}<div class="panel pad" style="text-align:center;padding:35px 20px"><div class="bigicon">${q.icon}</div><div class="eyebrow">AN UNCHARTED EVENT</div><h1 class="title">${esc(q.title)}</h1><p class="subtitle" style="margin:0 auto">${esc(q.desc)}</p></div><div class="choicegrid" style="margin-top:14px">${q.options.map((o,i)=>`<button type="button" class="choice" data-action="event-choice" data-index="${i}"><span class="sym">${i===0?'✦':'◈'}</span><span><b>${esc(o[0])}</b><p>${esc(o[1])}</p></span></button>`).join('')}</div>${renderHud()}</section>`}
function renderEnd(win){const r=R();return `<section class="screen"><div class="panel result"><div class="bigicon">${win?'✹':'☽'}</div><div class="eyebrow">${win?'THE RIFT HAS BEEN SEALED':'THE RIFT CLAIMS ANOTHER'}</div><h1>${win?'Legend of the Rift.':'The journey ends.'}</h1><p>${win?'Three realms conquered. You fought through impossible odds and returned with a legend. Try a different deck and path next time.':'Your cards are scattered, but the knowledge remains. Every expedition makes the next one stronger.'}</p><div class="statgrid"><div class="stat"><b>${r.score}</b><span>Score</span></div><div class="stat"><b>${r.kills}</b><span>Enemies beaten</span></div><div class="stat"><b>+${r.earnedSigils||0}</b><span>Permanent Sigils</span></div></div><div class="row" style="margin-top:24px"><button class="btn" type="button" data-action="fresh-after">↻ Return to camp</button><button class="btn secondary" type="button" data-action="archive">✧ Upgrades</button></div><p class="micro">Your Sigils unlock permanent starting perks. Keep climbing!</p></div></section>`}
function render(keepScroll=false){if(!el)return;const scrollTop=keepScroll?window.scrollY:0;initialScroll=document.getElementById('hand')?.scrollLeft||0;let main='';try{switch(state.screen){case'menu':main=renderMenu();break;case'map':main=renderMap();break;case'battle':main=renderBattle();break;case'reward':main=renderReward();break;case'relicReward':main=renderRelicReward();break;case'camp':main=renderCamp();break;case'shop':main=renderShop();break;case'event':main=renderEvent();break;case'victory':main=renderEnd(true);break;case'defeat':main=renderEnd(false);break;default:main=renderMenu()}}catch(err){console.error('Render failed',err);main='<div class="fatal"><h2>Something went wrong</h2><p>Reload the page to restore your saved run.</p><button type="button" class="btn" onclick="location.reload()">Reload</button></div>'}el.innerHTML=renderHeader()+main;if(keepScroll){document.getElementById('hand')?.scrollTo({left:initialScroll,behavior:'instant'});window.scrollTo({top:scrollTop,behavior:'instant'});}else{window.scrollTo({top:0,behavior:'instant'})}renderModal()}
function renderModal(){if(!modal){modals.innerHTML='';return}let body='';if(modal==='help'){body=`<h2>How to play</h2><p>In <b>ECHOBOUND</b>, every battle is turn-based. Your enemies show exactly what they intend to do next.</p><ul><li><b>Play a card:</b> tap it in your hand. Each card costs Energy (the gold circle).</li><li><b>Target:</b> tap an enemy before playing an Attack. Default target is the first living enemy.</li><li><b>Block:</b> prevents damage but expires at the beginning of your next turn.</li><li><b>Statuses:</b> Strength adds damage; Weak reduces damage by 25%; Vulnerable increases damage taken by 50%; Poison and Burn deal damage at turn end.</li><li><b>Plan ahead:</b> kill threats, block heavy attacks, and build combos. The <b>End Turn</b> button allows enemies to act.</li><li><b>Grow stronger:</b> choose cards after fights, buy relics and upgrade a card at a hearth.</li><li><b>Keep your progress:</b> your run saves after every action. You can leave and return anytime on the same device.</li></ul><div class="notice">Tip: Early on, focus on surviving each fight. Killing one enemy before the next enemy phase often saves more HP than playing a small defense card.</div>`}
 else if(modal==='deck'){body=`<h2>Your expedition</h2>${renderHud()}<p><b>Current relics</b></p><div style="display:grid;gap:7px">${R().relics.map(id=>`<div class="relic"><span class="sym">${RELICS[id].sym}</span><div><b>${esc(RELICS[id].name)}</b><small>${esc(RELICS[id].desc)}</small></div></div>`).join('')||'<p>No relics yet. Hunt elites and bosses to find them.</p>'}</div><div class="divider"></div><p><b>${R().deck.length} cards in your deck</b></p><div class="decklist">${R().deck.map(c=>`<div class="deckrow"><span class="emblem">${C[c.id].icon}</span><span><b>${esc(C[c.id].name)}${c.up?' ★':''}</b><span class="meta">${esc(C[c.id].desc(c.up))}</span></span></div>`).join('')}</div>`}
 else if(modal==='upgrade'){body=`<h2>Upgrade a card</h2><p>Select one card. Upgraded cards stay improved for the whole expedition.</p><div class="decklist">${R().deck.map((c,i)=>`<button type="button" class="deckrow" data-action="upgrade" data-index="${i}" ${c.up?'disabled':''}><span class="emblem">${C[c.id].icon}</span><span><b>${esc(C[c.id].name)}${c.up?' ★':''}</b><span class="meta">${c.up?'Already upgraded':`${esc(C[c.id].desc(c.up))} → ${esc(C[c.id].desc(true))}`}</span></span></button>`).join('')}</div>`}
 else if(modal==='archive'){body=`<h2>The Archives</h2><p>Earn <b>Sigils</b> by exploring and defeating enemies. Spend them on permanent bonuses for future expeditions.</p><div class="runhud"><span class="pill">✧ <strong>${meta.sigils}</strong> Sigils available</span><span class="pill">✹ <strong>${meta.wins}</strong> Victories</span></div><div class="archivegrid">${Object.entries(perks).map(([id,p])=>{const lvl=meta.perks[id]||0,done=lvl>=p.max,price=done?0:p.cost[lvl];return `<button type="button" class="shopitem" data-action="perk" data-id="${id}" ${done||meta.sigils<price?'disabled':''}><span class="sym">${p.sym}</span><b>${p.name} <span class="labeltag">${lvl}/${p.max}</span></b><small>${p.desc}</small><span class="price">${done?'MAXED':`✧ ${price} Sigils`}</span></button>`}).join('')}</div><div class="divider"></div><p class="micro">All three acts and all cards are playable without upgrades. These perks only smooth your next attempt.</p>`}
 else if(modal==='confirm-new'){body=`<h2>Start a new expedition?</h2><p>Your current run will be permanently replaced. Your Archives, Sigils, and permanent upgrades remain.</p><div class="row"><button type="button" class="btn danger" data-action="confirm-new-yes">Replace current run</button><button type="button" class="btn secondary" data-action="modal-close">Keep my run</button></div>`}
 else if(modal==='paused'){body=`<div class="center"><div class="bigicon">Ⅱ</div><h2>Expedition paused</h2><p>Your exact hand, HP and enemy intentions are safely saved. Return anytime.</p><div class="row" style="justify-content:center"><button type="button" class="btn" data-action="modal-close">▶ Resume battle</button><button type="button" class="btn secondary" data-action="pause-menu">⌂ Main menu</button></div></div>`}
 modals.innerHTML=`<div class="modalback" role="presentation" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${modal==='paused'?'Pause':'Game information'}"><div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:7px"><span class="eyebrow">ECHOBOUND / GROUPQUEST</span>${modal==='paused'?'':`<button type="button" class="iconbtn" data-action="modal-close" aria-label="Close">✕</button>`}</div>${body}</div></div>`;
}
let lastToastTimer=null;
function note(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;toasts.append(n);while(toasts.children.length>3)toasts.firstElementChild.remove();setTimeout(()=>{n.remove()},2300)}
function sfx(type){if(meta.muted)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audioCtx)audioCtx=new Audio();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const now=audioCtx.currentTime;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const settings={hit:[155,90,.075],card:[410,600,.07],turn:[330,220,.12],fail:[165,95,.15],win:[490,780,.25],chime:[580,840,.18]}[type]||[360,480,.06];o.type=(type==='hit'||type==='fail')?'triangle':'sine';o.frequency.setValueAtTime(settings[0],now);o.frequency.exponentialRampToValueAtTime(settings[1],now+settings[2]);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.055,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+settings[2]);o.start(now);o.stop(now+settings[2]+.02)}catch(e){}}
function handleAction(button){const action=button.dataset.action;if(!action)return;const i=Number(button.dataset.index||0);switch(action){case'new':newRun();break;case'resume':resume();break;case'menu':goMenu();break;case'pause':modal='paused';save();renderModal();break;case'pause-menu':modal=null;goMenu();break;case'help':showHelp();break;case'archive':showArchive();break;case'deck':showDeck();break;case'modal-close':closeModal();break;case'confirm-new':modal='confirm-new';renderModal();break;case'confirm-new-yes':modal=null;newRun();break;case'sound':meta.muted=!meta.muted;save();render(true);break;case'route':chooseRoute(button.dataset.type);break;case'target':selection=button.dataset.id;render(true);break;case'card':playCard(i);break;case'end-turn':endTurn();break;case'potion':potion();break;case'reward-card':acceptCard(state.reward?.cards?.[i]);break;case'skip':skipCard();break;case'reward-relic':acceptRelic(button.dataset.id);break;case'no-relic':state.reward=null;completeNode();break;case'camp-heal':campHeal();break;case'camp-upgrade':campUpgrade();break;case'upgrade':upgradeCard(i);break;case'buy':buyShop(button.dataset.kind,i);break;case'leave-shop':completeNode();break;case'event-choice':eventChoice(i);break;case'perk':buyPerk(button.dataset.id);break;case'fresh-after':restartAfterEnd();break;}}
function wire(){document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled){if(modal && !modals.contains(b) && !['sound'].includes(b.dataset.action))return;handleAction(b)}else if(e.target.classList.contains('modalback')&&modal!=='paused'){closeModal()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&modal!=='paused')closeModal();if(modal||state.screen!=='battle')return;if(e.key===' '){if(e.target.matches('button,input,textarea'))return;e.preventDefault();endTurn()}else if(/^[1-9]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey){playCard(Number(e.key)-1)}});window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()})}
function init(){load();wire();try{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}}catch(e){}render()}
window.__ECHOBOUND_QA={get:()=>deep({state,meta}),newRun,chooseRoute,playCard,endTurn,potion,chooseTarget:id=>{selection=id},acceptCard,skipCard,acceptRelic,buyShop,completeNode,save,winBattle,offerCards,checkWin,reset:()=>{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(META_KEY);location.reload()}};
init();
})();
</script>
</body>
