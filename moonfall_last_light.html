<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>MOONFALL · Last Light — GroupQuest</title>
<style>
:root{color-scheme:dark;--ink:#ebeedf;--muted:#a5b7ac;--line:#48605b;--gold:#f1cd83;--mint:#8ce9c6;--deep:#0a181a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#081719;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#081719}

#app.playing #hud{display:block}
.hudTop{display:flex;align-items:center;gap:9px;max-width:790px;margin:auto}
.hudBadge{flex:0 0 auto;min-width:66px;border:1px solid #70857c88;background:#0c2021d9;border-radius:12px;padding:7px 9px;backdrop-filter:blur(12px)}
.hudBadge span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#aac1b5;font-weight:750}
.hudBadge strong{display:block;font-size:19px;color:#f6e4bd;font-family:Georgia,serif;line-height:1.1}
.meters{flex:1;min-width:0}
.meter{height:13px;border:1px solid #e7d6ae55;border-radius:9px;background:#071514db;overflow:hidden;position:relative;margin:3px 0}
.meter>span{height:100%;width:100%;display:block;transition:width .15s;box-shadow:inset 0 1px 2px #ffffff44}
#healthFill{background:linear-gradient(90deg,#b95652,#f38a76)}
#shieldFill{background:linear-gradient(90deg,#478c9e,#a8efdf)}
.meterInfo{display:flex;justify-content:space-between;gap:3px;font-size:10px;font-weight:700;color:#e0ebe2;text-shadow:0 1px 3px #000}
.hudRight{display:grid;gap:5px;justify-items:end}
.tiny{color:#d0ded1;font-size:11px;font-weight:700;text-align:right;text-shadow:0 2px 4px #000}
.iconBtn{pointer-events:auto;display:grid;place-items:center;width:41px;height:41px;border-radius:12px;background:#182c2abf;border:1px solid #73968a88;color:#f0eddc;font-size:22px}
.waveLine{max-width:790px;margin:8px auto 0;display:flex;gap:10px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.7px;color:#cbe0d3;text-shadow:0 1px 3px #000}
.waveTrack{flex:1;height:5px;border-radius:99px;background:#142c2a;border:1px solid #93aa8b44;overflow:hidden}
#waveFill{display:block;height:100%;width:0;background:linear-gradient(90deg,#6faf92,#e9d08c);transition:width .2s}
#controls{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 22px max(23px,env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:end;pointer-events:none}
#app.playing #controls{display:flex}
#joystick{width:122px;height:122px;border:1.5px solid #b2e2ce66;border-radius:50%;background:radial-gradient(circle,#6a8f8060 0%,#1a373741 47%,#07191b88 100%);box-shadow:inset 0 0 25px #0005,0 0 0 7px #e2ebcd0a;position:relative;pointer-events:auto;touch-action:none}
#joystick:before{content:'MOVE';position:absolute;top:12px;width:100%;text-align:center;letter-spacing:2px;font-size:10px;font-weight:850;color:#d9eee2a0}
#stick{width:57px;height:57px;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 38% 32%,#d6f8ddaa,#629c8a7a 40%,#254745bb 100%);border:2px solid #a1dbbf99;box-shadow:0 5px 17px #0009,inset 0 1px 3px #fff6;pointer-events:none}
.rightControls{display:grid;gap:8px;justify-items:center;pointer-events:auto}
#dashBtn{width:91px;height:91px;border-radius:50%;border:2px solid #e9d19e;background:radial-gradient(circle at 40% 30%,#d8b778,#735737 60%,#241e18 100%);color:#fff1d3;box-shadow:0 5px 28px #050e0ea3,inset 0 0 0 5px #191c1a88;position:relative;overflow:hidden;display:grid;place-items:center;align-content:center}
#dashBtn strong{font-size:15px;letter-spacing:1.3px;z-index:1}#dashBtn small{font-size:10px;color:#faf0d7;z-index:1;margin-top:4px}#dashShade{position:absolute;inset:0;background:#051617a8;transform-origin:bottom;transform:scaleY(0);pointer-events:none}
.controlsHint{font-size:10px;color:#d9e6d59c;text-shadow:0 1px 6px #000;font-weight:750;letter-spacing:1px}
#toast{position:absolute;z-index:4;left:50%;top:25%;transform:translate(-50%,-20px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center;width:90%;font-family:Georgia,serif;font-weight:bold;color:#ffe6aa;text-shadow:0 2px 8px #000,0 0 25px #f8c87880;font-size:clamp(22px,6vw,38px);letter-spacing:1px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modalLayer{z-index:5;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(17px,env(safe-area-inset-bottom));background:linear-gradient(160deg,#020b0ab5,#07151370 40%,#020a0bc9);backdrop-filter:blur(5px);overflow-y:auto;touch-action:pan-y}
#modalLayer.hidden{display:none}
.panel{width:min(100%,440px);max-height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;border:1px solid #c6caa57a;border-radius:25px;padding:22px 20px 20px;background:linear-gradient(153deg,#263d38f5,#122624f8 45%,#101c20f8 100%);box-shadow:0 24px 80px #000a, inset 0 1px 0 #ffffff22;position:relative}
.panel:before{content:'';position:absolute;left:26px;right:26px;top:0;height:2px;background:linear-gradient(90deg,transparent,#edce8d,transparent)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;font-weight:850;letter-spacing:2.7px;color:#f2dca4;text-transform:uppercase}
.brand small{color:#9bbbae;font-weight:700;letter-spacing:1px}
.title{font-family:Georgia,serif;text-align:center;margin:14px 0 0;font-size:clamp(39px,11vw,55px);letter-spacing:-2.2px;line-height:.9;color:#fff1d8;text-shadow:0 4px 15px #000a}
.subtitle{text-align:center;color:#e5c991;font:700 12px/1.4 ui-sans-serif,system-ui;letter-spacing:4.5px;margin:9px 0 0}
.heroArt{height:155px;display:grid;place-items:center;position:relative;overflow:hidden;margin:12px 0 10px}
.heroArt:before{content:'';position:absolute;width:175px;height:175px;border:1px solid #a1dbc176;border-radius:50%;box-shadow:0 0 30px #b6dab325,inset 0 0 30px #95dcb328;animation:circlePulse 4s ease-in-out infinite}
.heroArt:after{content:'';position:absolute;width:125px;height:125px;border:2px dashed #e8cc8b66;border-radius:50%;animation:slowspin 23s linear infinite}
.emblem{font-size:91px;filter:drop-shadow(0 5px 17px #eddc8277);z-index:1;animation:float 3.5s ease-in-out infinite;line-height:1}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes circlePulse{50%{transform:scale(1.14);opacity:.55}}@keyframes slowspin{to{transform:rotate(360deg)}}
.tagline{text-align:center;font-size:13px;line-height:1.6;color:#c2d2c4;margin:11px auto 18px;max-width:320px}
.pillrow{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:0 0 15px}
.pill{font-size:10px;font-weight:800;color:#bdd9c6;background:#283d3799;border:1px solid #71928366;padding:7px 10px;border-radius:99px}
.btn{border:1px solid #dabe84;min-height:50px;border-radius:13px;padding:12px 16px;font-weight:850;letter-spacing:.3px;background:linear-gradient(135deg,#f5d99b,#d2a965);color:#1e2924;box-shadow:0 7px 20px #0006,inset 0 1px 0 #fff5;width:100%;transition:transform .12s}
.btn:active,.upgrade:active{transform:scale(.98)}
.btnSecondary{background:#1a302e;color:#d9e9da;border-color:#5a8275;box-shadow:none}
.row{display:flex;gap:9px}.row>*{min-width:0;flex:1}
.note{font-size:11px;color:#a6bcae;text-align:center;line-height:1.5;margin:12px 0 0}
.heading{font-family:Georgia,serif;font-size:28px;color:#fff0d3;text-align:center;margin:16px 0 4px}
.description{text-align:center;color:#b6c8ba;font-size:13px;line-height:1.5;margin:8px 0 16px}
.stats{display:flex;gap:6px;margin:12px 0}.stat{flex:1;min-width:0;text-align:center;background:#0b201e91;padding:10px 4px;border:1px solid #66847755;border-radius:13px}.stat strong{display:block;color:#f3dfb8;font-size:18px;font-family:Georgia,serif}.stat span{font-size:10px;color:#9eb8a7}
.divider{height:1px;background:#7a96816b;margin:16px 0 13px}
.forgeTitle{font-weight:850;color:#f0d49c;letter-spacing:1px;font-size:12px;margin:0 0 9px}
.forge{display:grid;gap:7px;margin:9px 0 12px}
.forge button{display:flex;align-items:center;text-align:left;gap:10px;min-height:53px;padding:9px;border:1px solid #78918277;border-radius:12px;background:#112927b7;color:#dceadb}
.forge button:disabled{opacity:.5;cursor:not-allowed}
.forge .forgeIcon{display:grid;place-items:center;width:39px;height:39px;flex:0 0 auto;border-radius:10px;background:#3450476b;font-size:22px}
.forge .forgeCopy{flex:1;min-width:0}.forgeCopy b{font-size:13px;display:block}.forgeCopy small{font-size:10px;color:#abc2b3;display:block;margin-top:2px}
.price{font-size:11px;font-weight:800;color:#eed49f;white-space:nowrap}
.instructions{display:grid;gap:9px;margin:14px 0 17px}.instruction{display:flex;gap:10px;align-items:center;color:#d6e5d6;font-size:13px;line-height:1.4}.instruction b{color:#ffe6aa}.instruction .circle{display:grid;place-items:center;border-radius:13px;background:#2a4942;width:42px;height:42px;font-size:21px;flex:0 0 auto}
.upgradeList{display:grid;gap:9px;margin:17px 0}
.upgrade{min-height:92px;width:100%;display:flex;gap:14px;align-items:center;text-align:left;padding:15px 14px;border:1px solid #809784a5;background:linear-gradient(115deg,#193733,#213d37);color:#e3f1e4;border-radius:15px}
.upgradeSymbol{width:52px;height:52px;flex:0 0 auto;display:grid;place-items:center;background:#46645366;border:1px solid #799c8059;border-radius:14px;font-size:27px}
.upgrade b{font-size:16px;color:#fce6b8}.upgrade small{display:block;color:#b9cdbb;font-size:12px;margin-top:5px;line-height:1.35}
.emphasis{color:#f0d497;font-weight:850}
#soundBtn{width:auto;padding:6px 10px;min-height:33px;background:#15302b;color:#dfeddf;border:1px solid #718e7977;border-radius:9px;font-size:12px;font-weight:800}
@media(max-width:360px){#joystick{width:106px;height:106px}#dashBtn{width:79px;height:79px}.panel{padding:17px 15px}.heroArt{height:128px}.emblem{font-size:75px}.meter{height:11px}.hudBadge{min-width:54px;padding:5px 6px}}
@media(prefers-reduced-motion:reduce){.heroArt:before,.heroArt:after,.emblem{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div id="app">
<canvas id="world" aria-label="Animated top-down action game arena"></canvas><div id="vignette"></div>
<div id="hud" aria-live="off">
 <div class="hudTop"><div class="hudBadge"><span>WAVE</span><strong id="hudWave">1 / 12</strong></div><div class="meters"><div class="meterInfo"><span>❤ LIGHT</span><span id="hpText">100/100</span></div><div class="meter"><span id="healthFill"></span></div><div class="meterInfo" style="margin-top:4px"><span>✦ GUARD</span><span id="guardText">0</span></div><div class="meter" style="height:7px"><span id="shieldFill"></span></div></div><div class="hudRight"><button class="iconBtn" type="button" id="pauseBtn" aria-label="Pause game">Ⅱ</button><div class="tiny" id="hudKills">0 defeated</div></div></div>
 <div class="waveLine"><span id="objective">CLEAR THE GROVE</span><div class="waveTrack"><span id="waveFill"></span></div><span id="hudScore">0 ✧</span></div>
</div>
<div id="controls"><div id="joystick" aria-label="Virtual joystick, drag to move" role="group"><div id="stick"></div></div><div class="rightControls"><button type="button" id="dashBtn" aria-label="Dash to evade enemies"><span id="dashShade"></span><strong>➤ DASH</strong><small id="dashStatus">READY</small></button><div class="controlsHint">AUTO-ATTACK ON</div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modalLayer"><div class="panel" id="modalContent"></div></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),app=$('app'),canvas=$('world'),ctx=canvas.getContext('2d'),modal=$('modalLayer'),body=$('modalContent');
const TAU=Math.PI*2,STORAGE='gq_moonfall_v1_profile',SAVE='gq_moonfall_v1_run';
const rgba=(r,g,b,a)=>`rgba(${r},${g},${b},${a})`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const random=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const normalize=(x,y)=>{let l=Math.hypot(x,y)||1;return {x:x/l,y:y/l}};
const hash=(x,y,seed=17)=>{let v=Math.sin(x*127.1+y*311.7+seed*42.37)*43758.5453;return v-Math.floor(v)};
const freshProfile=()=>({shards:0,bestWave:0,bestScore:0,runs:0,meta:{heart:0,power:0,step:0}});
function safeGet(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function safeSet(key,data){try{localStorage.setItem(key,JSON.stringify(data))}catch{}}
function safeDel(key){try{localStorage.removeItem(key)}catch{}}
let profile=safeGet(STORAGE)||freshProfile();profile.meta||=(freshProfile().meta);for(let k of ['heart','power','step'])profile.meta[k]=clamp(Number(profile.meta[k])||0,0,5);
const CAP=95;let W=390,H=780,DPR=1,last=0,clock=0,saveClock=0,shake=0,flash=0,game=null,particles=[],texts=[],ambient=[],stars=[];
const inputs={keys:new Set(),joy:{x:0,y:0,id:null},target:null};let audioCtx=null,sound=true,muteSaved=false;
const upgrades=[
 {id:'blade',name:'Sunforged Blade',icon:'⚔',detail:'+7 bolt damage.'},
 {id:'tempo',name:'Quick Hands',icon:'⌁',detail:'Attack 16% faster.'},
 {id:'heart',name:'Living Ember',icon:'♥',detail:'+25 max HP and heal 30.'},
 {id:'steps',name:'Windstep',icon:'➤',detail:'+19 move speed and shorter dash recharge.'},
 {id:'twin',name:'Twin Sparks',icon:'✧',detail:'Fire one extra bolt each attack (up to 3).'},
 {id:'shield',name:'Moon Ward',icon:'⬡',detail:'Gain 30 guard. Guard absorbs damage.'},
 {id:'pierce',name:'Ghost Bolt',icon:'↗',detail:'Bolts pass through one extra enemy.'},
 {id:'frost',name:'Winter Touch',icon:'❄',detail:'Shots slow enemies. Increased slow each pick.'},
 {id:'orbit',name:'Guardian Wisp',icon:'◈',detail:'Summon an orbiting spirit that hurts nearby foes.'},
 {id:'heal',name:'Second Dawn',icon:'✚',detail:'Restore 55 HP (or 35 max HP if full).'}
];
const enemyTypes={
 shade:{hp:27,speed:77,r:15,damage:9,score:15,color:'#a4b18a'},
 spark:{hp:16,speed:132,r:12,damage:7,score:18,color:'#dda47b'},
 brute:{hp:75,speed:48,r:24,damage:18,score:40,color:'#be8e71'},
 sage:{hp:32,speed:56,r:17,damage:8,score:28,color:'#8bbec2'},
 boss:{hp:320,speed:60,r:39,damage:19,score:280,color:'#e2b37f'}
};
function newPlayer(){return {x:0,y:0,vx:0,vy:0,r:18,hp:110+profile.meta.heart*9,maxHp:110+profile.meta.heart*9,guard:0,speed:215+profile.meta.step*8,damage:17+profile.meta.power*2,fireRate:.55,shots:1,pierce:0,slow:0,orbits:0,dashCooldown:3.15,dashTimer:0,dashReady:0,invuln:0,attackTimer:.25,faceX:1,faceY:0,steps:0,upgradeLevels:{}}}
function newGame(){return {phase:'play',wave:1,waveElapsed:0,waveSpawned:0,waveTotal:0,queue:[],enemies:[],bullets:[],enemyBullets:[],score:0,kills:0,earned:0,totalTime:0,nextId:1,player:newPlayer(),choices:[],seed:Math.random()*1000000|0,extra:false,progress:0}}
function wavePlan(w){const boss=w%4===0;let n=5+Math.round(w*1.85);let q=[];for(let i=0;i<n;i++){let tier=(i*7+w*3)%14;let type=tier<5?'shade':tier<9?'spark':tier<12&&w>=2?'brute':w>=3?'sage':'shade';q.push(type)}if(boss)q.push('boss');if(w>12)q.push(...Array.from({length:Math.min(20,w-12)*2},(_,i)=>i%3?'shade':'spark'));return q.sort(()=>Math.random()-.5)}
function initWave(){game.waveElapsed=0;game.waveSpawned=0;game.queue=wavePlan(game.wave);game.waveTotal=game.queue.length;game.enemies=[];game.enemyBullets=[];game.bullets=[];game.progress=0;toast(game.wave%4===0?'BOSS WAVE · STAY SHARP':`WAVE ${game.wave} · SURVIVE`,2.1);updateHud()}
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(250,r.width);H=Math.max(320,r.height);DPR=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ambient=Array.from({length:45},(_,i)=>({x:hash(i,7)*W,y:hash(i,14)*H,a:hash(i,20)*TAU,s:.3+hash(i,33)*.7}))}
function playSound(freq=380,duration=.06,type='sine',volume=.028,slide=0){if(!sound)return;try{audioCtx||=(new (window.AudioContext||window.webkitAudioContext)());if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,now);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(50,freq+slide),now+duration);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.01)}catch{}}
function toast(msg,seconds=1.6){const node=$('toast');node.textContent=msg;node.classList.add('show');node.dataset.until=String(performance.now()/1000+seconds)}
function showModal(html){body.innerHTML=html;modal.classList.remove('hidden');app.classList.remove('playing');bindModal()}
function hideModal(){modal.classList.add('hidden');app.classList.add('playing')}
function statsHTML(){return `<div class="stats"><div class="stat"><strong>${profile.bestWave||'—'}</strong><span>Best wave</span></div><div class="stat"><strong>${(profile.bestScore||0).toLocaleString('en')}</strong><span>Best score</span></div><div class="stat"><strong>${profile.shards} ✧</strong><span>Moon shards</span></div></div>`}
function menu(){game&&game.phase==='menu';const stored=safeGet(SAVE);const continuing=!!(stored&&stored.wave&&stored.player&&stored.phase!=='dead');showModal(`<div class="brand"><span>✦ GROUPQUEST ORIGINAL</span><small>VERSION 1.0</small></div><h1 class="title">MOONFALL</h1><div class="subtitle">THE LAST LIGHT</div><div class="heroArt"><div class="emblem">⚔️</div></div><div class="pillrow"><span class="pill">REAL-TIME COMBAT</span><span class="pill">12 WAVES + ENDLESS</span><span class="pill">AUTO-SAVE</span></div><p class="tagline">The dark is closing in. Move, dodge and cut through the shadows. Build a stronger guardian after every wave.</p><button class="btn" id="startBtn">${continuing?'▶ CONTINUE YOUR RUN':'⚔ START ADVENTURE'}</button><div class="row" style="margin-top:9px"><button class="btn btnSecondary" id="newBtn">↺ NEW RUN</button><button class="btn btnSecondary" id="howBtn">? HOW TO PLAY</button></div>${statsHTML()}<div class="divider"></div><div class="forgeTitle">THE FORGE · Permanent upgrades</div><div id="forgeArea" class="forge"></div><div class="row" style="align-items:center;justify-content:space-between;margin-top:13px"><span class="note" style="margin:0">Play for free · No installation · Offline</span><button id="soundBtn">${sound?'♫ SOUND ON':'♫ SOUND OFF'}</button></div>`);renderForge()}
function forgeCost(type){let l=profile.meta[type]||0;return l>=5?Infinity:25+l*22}
function renderForge(){const a=$('forgeArea');if(!a)return;const entries=[['heart','♥','Vitality','Start with more health.'],['power','⚔','Strike','Deal more damage.'],['step','➤','Agility','Move faster.']];a.innerHTML=entries.map(([id,ico,name,desc])=>{const lv=profile.meta[id]||0,price=forgeCost(id);return `<button data-forge="${id}" ${profile.shards<price||lv>=5?'disabled':''}><span class="forgeIcon">${ico}</span><span class="forgeCopy"><b>${name} · ${lv}/5</b><small>${desc}</small></span><span class="price">${lv>=5?'MAX':price+' ✧'}</span></button>`}).join('');a.querySelectorAll('[data-forge]').forEach(el=>el.addEventListener('click',()=>{let t=el.dataset.forge,c=forgeCost(t);if(profile.shards>=c){profile.shards-=c;profile.meta[t]++;safeSet(STORAGE,profile);playSound(620,.18,'triangle',.04,280);menu()}}))}
function how(){showModal(`<div class="brand">✦ FIELD GUIDE <small>THREE SIMPLE RULES</small></div><h2 class="heading">You're the guardian.</h2><p class="description">A real action game — your character moves, shoots and dodges automatically.</p><div class="instructions"><div class="instruction"><span class="circle">◉</span><span><b>MOVE</b> using the left joystick, or WASD / arrow keys.</span></div><div class="instruction"><span class="circle">✧</span><span><b>AUTO-ATTACK</b> — your magic bolts find nearby enemies. No aiming needed.</span></div><div class="instruction"><span class="circle">➤</span><span><b>DASH</b> to escape danger (button or Space).</span></div><div class="instruction"><span class="circle">⚔</span><span><b>DEFEAT EACH WAVE</b> and choose a power. Every 4th wave has a boss.</span></div><div class="instruction"><span class="circle">Ⅱ</span><span><b>PAUSE ANYTIME</b>. The game saves your exact progress on this device.</span></div></div><button id="howPlay" class="btn">⚔ LET'S PLAY</button><button id="howBack" class="btn btnSecondary" style="margin-top:9px">← BACK</button>`)}
function bindModal(){const bind=(id,fn)=>{$(id)?.addEventListener('click',fn)};bind('startBtn',()=>{playSound(520,.1);let snap=safeGet(SAVE);if(snap&&snap.wave&&snap.player&&snap.phase!=='dead')restoreRun(snap);else startNew()});bind('newBtn',()=>{startNew()});bind('howBtn',how);bind('howBack',menu);bind('howPlay',()=>{const snap=safeGet(SAVE);if(snap&&snap.phase!=='dead')restoreRun(snap);else startNew()});bind('resumeBtn',resume);bind('menuBtn',()=>{persist();menu()});bind('restartBtn',startNew);bind('quitBtn',()=>{safeDel(SAVE);game=null;menu()});bind('endlessBtn',()=>{game.wave=13;game.extra=true;game.phase='play';initWave();hideModal();persist()});bind('nextBtn',()=>{game.wave++;game.phase='play';initWave();hideModal();persist()});body.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>pickUpgrade(el.dataset.pick)));bind('soundBtn',()=>{sound=!sound;muteSaved=true;safeSet('gq_moonfall_sound',sound);if(game?.phase==='pause')pause();else menu()})}
function startNew(){profile.runs++;safeSet(STORAGE,profile);safeDel(SAVE);game=newGame();particles=[];texts=[];inputs.target=null;initWave();hideModal();persist();playSound(600,.15,'triangle',.035,420)}
function restoreRun(snap){try{game={...newGame(),...snap,player:{...newPlayer(),...snap.player},enemies:Array.isArray(snap.enemies)?snap.enemies:[],bullets:Array.isArray(snap.bullets)?snap.bullets:[],enemyBullets:Array.isArray(snap.enemyBullets)?snap.enemyBullets:[],queue:Array.isArray(snap.queue)?snap.queue:[],choices:Array.isArray(snap.choices)?snap.choices:[]};game.nextId=Number(game.nextId)||1;game.player.upgradeLevels||={};if(game.phase==='reward')rewardScreen();else if(game.phase==='win')winScreen();else{game.phase='play';hideModal();toast('RUN RESTORED',1.25)}updateHud()}catch{startNew()}}
function persist(){if(!game||game.phase==='dead'||game.phase==='menu')return;const snap={...game,enemies:game.enemies.slice(0,120),bullets:game.bullets.slice(0,120),enemyBullets:game.enemyBullets.slice(0,120)};safeSet(SAVE,snap);safeSet(STORAGE,profile)}
function resume(){if(!game)return menu();game.phase='play';hideModal();saveClock=0;updateHud()}
function pause(){if(!game||game.phase!=='play')return;game.phase='pause';persist();showModal(`<div class="brand">✦ BREATHING ROOM <small>PROGRESS SAVED</small></div><h2 class="heading">Paused</h2><p class="description">Your adventure is safe. Come back whenever you like.</p><div class="stats"><div class="stat"><strong>${game.wave}</strong><span>Wave</span></div><div class="stat"><strong>${game.kills}</strong><span>Enemies</span></div><div class="stat"><strong>${game.score}</strong><span>Score</span></div></div><button id="resumeBtn" class="btn">▶ RESUME</button><div class="row" style="margin-top:9px"><button id="menuBtn" class="btn btnSecondary">⌂ MAIN MENU</button><button id="soundBtn" class="btn btnSecondary">${sound?'♫ SOUND ON':'♫ SOUND OFF'}</button></div>`)}
function createEnemy(type){const def=enemyTypes[type],a=random(0,TAU),r=Math.max(230,Math.min(W,H)*.43+random(55,110));let wave=game.wave-1,b=type==='boss';return {id:game.nextId++,type,x:game.player.x+Math.cos(a)*r,y:game.player.y+Math.sin(a)*r,r:def.r,hp:(def.hp+(b?wave*42:wave*(type==='brute'?9:3.8)))*1,maxHp:0,speed:def.speed+Math.min(55,wave*(b?1.5:2.6)),damage:def.damage+Math.floor(wave/3)*2,t:0,shoot:random(1.3,2.9),pulse:0,slowTimer:0,flash:0,action:0,actionTimer:0,contact:0};}
function spawnNext(){let type=game.queue.shift();if(!type)return;let e=createEnemy(type);e.maxHp=e.hp;game.enemies.push(e);game.waveSpawned++;if(type==='boss'){shake=11;flash=.3;playSound(110,.5,'sawtooth',.075,-65);toast('THE HOLLOW WARDEN',2.2)}}
function addParticle(x,y,color,n=7,force=120){for(let i=0;i<n&&particles.length<CAP*4;i++){const a=random(0,TAU),v=random(20,force),life=random(.2,.65);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,r:random(1.4,4.3),color})}}
function textPop(x,y,text,color='#f8dbae'){texts.push({x,y,text,color,life:.8,vy:-50});if(texts.length>70)texts.shift()}
function hurtEnemy(e,dmg,dx,dy){if(e.hp<=0)return;e.hp-=dmg;e.flash=.14;e.x+=dx*2;e.y+=dy*2;addParticle(e.x,e.y,e.type==='boss'?'#facf91':'#e4c49d',4,115);textPop(e.x,e.y-e.r-10,String(Math.round(dmg)));shake=Math.max(shake,e.type==='boss'?3.3:1.5);playSound(random(220,290),.043,'triangle',.016,-95);if(e.hp<=0){game.kills++;game.score+=enemyTypes[e.type].score;addParticle(e.x,e.y,e.type==='boss'?'#f4c37c':'#a9d6b0',18,e.type==='boss'?260:175);shake=Math.max(shake,e.type==='boss'?15:4);if(e.type==='boss')flash=.38; if(game.kills%5===0){profile.shards++;game.earned++;safeSet(STORAGE,profile)}game.enemies=game.enemies.filter(m=>m.id!==e.id)}}
function hurtPlayer(dmg,dx,dy){const p=game.player;if(p.invuln>0||p.dashTimer>0)return;const absorbed=Math.min(p.guard,dmg);p.guard-=absorbed;let leftover=dmg-absorbed;p.hp=Math.max(0,p.hp-leftover);p.invuln=.75;p.x+=dx*13;p.y+=dy*13;shake=13;flash=.14;addParticle(p.x,p.y,'#ffe3bd',12,155);textPop(p.x,p.y-32,'−'+dmg,'#ffc5a8');playSound(170,.18,'sawtooth',.055,-90);if(p.hp<=0)lose()}
function shoot(from,to,type='sage'){const n=normalize(to.x-from.x,to.y-from.y);game.enemyBullets.push({x:from.x,y:from.y,vx:n.x*165,vy:n.y*165,r:type==='boss'?9:6,life:5,damage:type==='boss'?17:11,type})}
function radial(e,count=8){for(let i=0;i<count;i++){let a=i*TAU/count+clock*.2;game.enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*(145+game.wave*4),vy:Math.sin(a)*(145+game.wave*4),r:7,life:5,damage:14+Math.floor(game.wave/4)*2,type:'boss'})}addParticle(e.x,e.y,'#d2a9a1',23,180);playSound(140,.3,'sawtooth',.035,-40)}
function attack(){const p=game.player;let nearest=null,best=440*440;for(const e of game.enemies){let dx=e.x-p.x,dy=e.y-p.y,d=dx*dx+dy*dy;if(d<best){best=d;nearest=e}}if(!nearest)return;const a=Math.atan2(nearest.y-p.y,nearest.x-p.x);p.faceX=Math.cos(a);p.faceY=Math.sin(a);for(let i=0;i<p.shots;i++){const angle=a+(i-(p.shots-1)/2)*.18;game.bullets.push({x:p.x+Math.cos(angle)*19,y:p.y+Math.sin(angle)*19,vx:Math.cos(angle)*570,vy:Math.sin(angle)*570,life:.95,r:5.8,pierce:p.pierce,hit:[],dmg:p.damage,slow:p.slow});}addParticle(p.x+p.faceX*17,p.y+p.faceY*17,'#f6e5ad',4,85);playSound(510,.05,'sine',.013,-170)}
function dash(){if(!game||game.phase!=='play')return;const p=game.player;if(p.dashReady>0)return;let mv=movement();if(!mv.x&&!mv.y)mv={x:p.faceX,y:p.faceY};let n=normalize(mv.x,mv.y);p.faceX=n.x;p.faceY=n.y;p.dashTimer=.18;p.dashReady=p.dashCooldown;p.invuln=Math.max(p.invuln,.34);inputs.target=null;addParticle(p.x,p.y,'#f7e1ab',22,140);playSound(470,.22,'triangle',.055,-250);shake=3}
function movement(){let x=inputs.joy.x,y=inputs.joy.y;const k=inputs.keys;if(k.has('ArrowLeft')||k.has('a'))x-=1;if(k.has('ArrowRight')||k.has('d'))x+=1;if(k.has('ArrowUp')||k.has('w'))y-=1;if(k.has('ArrowDown')||k.has('s'))y+=1;if(x||y)return normalize(x,y);if(inputs.target&&game){let dx=inputs.target.x-game.player.x,dy=inputs.target.y-game.player.y;if(Math.hypot(dx,dy)>18)return normalize(dx,dy);inputs.target=null}return {x:0,y:0}}
function update(dt){clock+=dt;if(!game||game.phase!=='play'){updateEffects(dt*.65);return}const p=game.player;game.totalTime+=dt;game.waveElapsed+=dt;p.steps+=dt*10;p.invuln=Math.max(0,p.invuln-dt);p.attackTimer-=dt;p.dashReady=Math.max(0,p.dashReady-dt);p.dashTimer=Math.max(0,p.dashTimer-dt);const mv=movement();p.vx=mv.x*(p.dashTimer>0?820:p.speed);p.vy=mv.y*(p.dashTimer>0?820:p.speed);if(p.dashTimer>0){p.vx=p.faceX*820;p.vy=p.faceY*820;addParticle(p.x,p.y,'#82e5ce',2,110)}else if(mv.x||mv.y){p.faceX=mv.x;p.faceY=mv.y}p.x+=p.vx*dt;p.y+=p.vy*dt;
// A new enemy emerges every 0.45-0.78s; the entire wave is always finite and clearable.
if(game.queue.length&&game.waveElapsed>.35+game.waveSpawned*Math.max(.38,.72-game.wave*.021)&&game.enemies.length<28)spawnNext();
if(p.attackTimer<=0){attack();p.attackTimer=Math.max(.18,p.fireRate)}
for(const e of [...game.enemies]){e.t+=dt;e.flash=Math.max(0,e.flash-dt);e.contact=Math.max(0,e.contact-dt);e.slowTimer=Math.max(0,e.slowTimer-dt);let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;let slow=e.slowTimer>0?.59:1;let speed=e.speed*slow;if(e.type==='sage'){if(d>250){e.x+=nx*speed*dt;e.y+=ny*speed*dt}else if(d<180){e.x-=nx*speed*.65*dt;e.y-=ny*speed*.65*dt}e.shoot-=dt;if(e.shoot<0&&d<650){shoot(e,p);e.shoot=2.8-random(0,.55)}}else if(e.type==='boss'){e.action-=dt;if(e.action<=0&&e.actionTimer<=0){e.actionTimer=.85;e.action=4.2;toast('DODGE THE BURST!',.85)}if(e.actionTimer>0){e.actionTimer-=dt;if(e.actionTimer<=0)radial(e,Math.min(12,7+Math.floor(game.wave/4)*2))}if(d>95){e.x+=nx*speed*.8*dt;e.y+=ny*speed*.8*dt}}else {if(d>p.r+e.r-1){e.x+=nx*speed*dt;e.y+=ny*speed*dt}}
// Keep enemy bodies from stacking exactly on top of each other.
for(const other of game.enemies){if(other.id>=e.id)continue;let ax=e.x-other.x,ay=e.y-other.y,dis=Math.hypot(ax,ay)||1,minD=e.r+other.r-4;if(dis<minD){let push=(minD-dis)*.22;e.x+=ax/dis*push;e.y+=ay/dis*push;other.x-=ax/dis*push;other.y-=ay/dis*push}}
if(d<p.r+e.r-4&&e.contact<=0){hurtPlayer(e.damage,nx,ny);e.contact=.7}
}
for(let i=game.bullets.length-1;i>=0;i--){const b=game.bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0){game.bullets.splice(i,1);continue}for(const e of [...game.enemies]){if(b.hit.includes(e.id)||Math.hypot(b.x-e.x,b.y-e.y)>e.r+b.r)continue;let v=normalize(b.vx,b.vy);b.hit.push(e.id);hurtEnemy(e,b.dmg,v.x,v.y);if(b.slow)e.slowTimer=1.6+b.slow*.3;if(b.hit.length>b.pierce){game.bullets.splice(i,1);break}}}
for(let i=game.enemyBullets.length-1;i>=0;i--){let b=game.enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0){game.enemyBullets.splice(i,1);continue}if(Math.hypot(b.x-p.x,b.y-p.y)<p.r+b.r){const n=normalize(p.x-b.x,p.y-b.y);hurtPlayer(b.damage,n.x,n.y);game.enemyBullets.splice(i,1)}}
if(p.orbits){for(let k=0;k<p.orbits;k++){const angle=clock*2.8+k*TAU/p.orbits,ox=p.x+Math.cos(angle)*58,oy=p.y+Math.sin(angle)*58;for(const e of [...game.enemies]){if(e.contact>0||Math.hypot(e.x-ox,e.y-oy)>e.r+12)continue;hurtEnemy(e,9+Math.floor(game.wave/4)*2,0,0);e.contact=.38}}}
updateEffects(dt);if(!game.queue.length&&game.enemies.length===0&&game.waveSpawned>0){completeWave();return}saveClock+=dt;if(saveClock>2.5){saveClock=0;persist()}updateHud()}
function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){let f=particles[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.max(0,1-dt*2.3);f.vy*=Math.max(0,1-dt*2.3);f.life-=dt;if(f.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){let t=texts[i];t.y+=t.vy*dt;t.life-=dt;if(t.life<=0)texts.splice(i,1)}shake=Math.max(0,shake-dt*29);flash=Math.max(0,flash-dt*1.5);let toastNode=$('toast');if(toastNode.classList.contains('show')&&performance.now()/1000>Number(toastNode.dataset.until||0))toastNode.classList.remove('show')}
function completeWave(){let earned=12+game.wave*4;profile.shards+=earned;game.earned+=earned;profile.bestWave=Math.max(profile.bestWave,game.wave);profile.bestScore=Math.max(profile.bestScore,game.score);safeSet(STORAGE,profile);const p=game.player;p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*.22));p.guard=Math.min(80,p.guard+6);if(game.wave>=12&&!game.extra){game.phase='win';persist();winScreen();return}game.choices=chooseUpgrades();game.phase='reward';persist();rewardScreen();playSound(680,.25,'triangle',.07,440)}
function chooseUpgrades(){let pool=upgrades.filter(x=>{if(x.id==='twin'&&game.player.shots>=3)return false;if(x.id==='orbit'&&game.player.orbits>=3)return false;return true});for(let i=pool.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,3).map(a=>a.id)}
function rewardScreen(){const ids=game.choices||[];showModal(`<div class="brand">✦ WAVE ${game.wave} COMPLETE <small>+${12+game.wave*4} ✧ SHARDS</small></div><h2 class="heading">Choose your power</h2><p class="description">One upgrade. A stronger guardian. The shadows aren't done yet.</p><div class="upgradeList">${ids.map(id=>{let u=upgrades.find(a=>a.id===id);return `<button class="upgrade" data-pick="${id}"><span class="upgradeSymbol">${u.icon}</span><span><b>${u.name}</b><small>${u.detail}</small></span></button>`}).join('')}</div><p class="note">Pick an upgrade to begin wave ${game.wave+1}. You can safely close the game here.</p>`)}
function pickUpgrade(id){if(game.phase!=='reward'||!game.choices.includes(id))return;let p=game.player;p.upgradeLevels[id]=(p.upgradeLevels[id]||0)+1;switch(id){case 'blade':p.damage+=7;break;case 'tempo':p.fireRate=Math.max(.19,p.fireRate*.84);break;case 'heart':p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+30);break;case 'steps':p.speed+=19;p.dashCooldown=Math.max(2,p.dashCooldown-.13);break;case 'twin':p.shots=Math.min(3,p.shots+1);break;case 'shield':p.guard=Math.min(100,p.guard+30);break;case 'pierce':p.pierce+=1;break;case 'frost':p.slow+=1;break;case 'orbit':p.orbits=Math.min(3,p.orbits+1);break;case 'heal':if(p.hp>=p.maxHp*.96){p.maxHp+=35;p.hp+=35}else p.hp=Math.min(p.maxHp,p.hp+55)}game.wave++;game.phase='play';game.choices=[];initWave();hideModal();persist();playSound(760,.2,'triangle',.045,350)}
function lose(){if(game.phase!=='play')return;game.phase='dead';profile.bestWave=Math.max(profile.bestWave,game.wave-1);profile.bestScore=Math.max(profile.bestScore,game.score);safeSet(STORAGE,profile);safeDel(SAVE);playSound(260,.55,'triangle',.065,-180);showModal(`<div class="brand">✦ THE NIGHT CLAIMS THIS RUN <small>TRY AGAIN</small></div><h2 class="heading">The light fades…</h2><p class="description">You were defeated, but your moon shards and forge upgrades are yours forever.</p><div class="stats"><div class="stat"><strong>${game.wave}</strong><span>Reached wave</span></div><div class="stat"><strong>${game.kills}</strong><span>Enemies defeated</span></div><div class="stat"><strong>${game.score}</strong><span>Final score</span></div></div><p class="note" style="margin-bottom:15px">Earned this run: <span class="emphasis">${game.earned} ✧ moon shards</span></p><button id="restartBtn" class="btn">⚔ TRY AGAIN</button><button id="quitBtn" class="btn btnSecondary" style="margin-top:9px">⌂ MAIN MENU</button>`)}
function winScreen(){const p=game.player;showModal(`<div class="brand">✦ THE GROVE IS SAVED <small>VICTORY</small></div><h2 class="heading">DAWN RETURNS!</h2><p class="description">You cleared all 12 waves and defeated the darkness. But your legend can continue…</p><div class="heroArt" style="height:120px"><div class="emblem" style="font-size:74px">🏆</div></div><div class="stats"><div class="stat"><strong>${game.kills}</strong><span>Enemies defeated</span></div><div class="stat"><strong>${game.score}</strong><span>Score</span></div><div class="stat"><strong>${game.earned}</strong><span>Shards earned</span></div></div><button id="endlessBtn" class="btn">∞ ENTER ENDLESS MODE</button><button id="quitBtn" class="btn btnSecondary" style="margin-top:9px">⌂ SAVE VICTORY & MENU</button>`)}
function updateHud(){if(!game)return;const p=game.player;$('hudWave').textContent=`${game.wave}${game.extra?' ∞':' / 12'}`;$('hpText').textContent=`${Math.ceil(p.hp)}/${p.maxHp}`;$('healthFill').style.width=(100*p.hp/p.maxHp)+'%';$('guardText').textContent=Math.round(p.guard);$('shieldFill').style.width=(p.guard?Math.min(100,p.guard):0)+'%';$('hudKills').textContent=`${game.kills} defeated`;$('hudScore').textContent=game.score+' ✧';$('objective').textContent=game.wave%4===0?'DEFEAT THE WARDEN':'CLEAR THE GROVE';const done=game.waveTotal-game.queue.length-game.enemies.length;$('waveFill').style.width=clamp(100*done/Math.max(1,game.waveTotal),0,100)+'%';$('dashShade').style.transform=`scaleY(${Math.min(1,p.dashReady/p.dashCooldown)})`;$('dashStatus').textContent=p.dashReady>0?p.dashReady.toFixed(1)+'s':'READY'}
// ---- 2D WORLD: hand-drawn animated sprites and environmental details ----
function ground(camX,camY){ctx.fillStyle=game?.wave%4===0?'#0a1b22':'#102521';ctx.fillRect(0,0,W,H);const tile=126,sx=Math.floor((camX-W/2)/tile)-1,ex=Math.ceil((camX+W/2)/tile)+1,sy=Math.floor((camY-H/2)/tile)-1,ey=Math.ceil((camY+H/2)/tile)+1;for(let x=sx;x<=ex;x++)for(let y=sy;y<=ey;y++){const px=x*tile-camX+W/2,py=y*tile-camY+H/2,v=hash(x,y);ctx.fillStyle=v>.5?'#1c362b':'#152c26';ctx.globalAlpha=.17;ctx.fillRect(px,py,tile-1,tile-1);ctx.globalAlpha=1;let k=hash(x,y,31);if(k<.55){let fx=px+hash(x,y,5)*100+13,fy=py+hash(x,y,6)*100+11;ctx.lineWidth=1.7;ctx.strokeStyle=k<.25?'#5c71623e':'#67957c47';for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.sin(j*2)*6,fy-7-Math.cos(j*3)*3);ctx.stroke()}}else if(k<.72){let cx=px+30+hash(x,y,9)*58,cy=py+23+hash(x,y,10)*67;ctx.fillStyle='#819b8a28';ctx.beginPath();ctx.ellipse(cx,cy,12,6,.2,0,TAU);ctx.fill();ctx.strokeStyle='#a7ad8a32';ctx.stroke()}else if(k>.79&&k<.88){let cx=px+30+hash(x,y,17)*70,cy=py+25+hash(x,y,18)*67;ctx.fillStyle='#0517138a';ctx.beginPath();ctx.ellipse(cx,cy+9,20,8,0,0,TAU);ctx.fill();ctx.fillStyle='#3e655342';ctx.beginPath();ctx.arc(cx-9,cy,13,0,TAU);ctx.arc(cx+5,cy-3,17,0,TAU);ctx.arc(cx+17,cy+1,12,0,TAU);ctx.fill();ctx.strokeStyle='#87ab8352';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx+5,cy-2,12,Math.PI*1.1,Math.PI*1.85);ctx.stroke()}else if(k>.91){let cx=px+30+hash(x,y,12)*75,cy=py+20+hash(x,y,13)*65;ctx.strokeStyle='#cbad825c';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,9,0,TAU);ctx.moveTo(cx-12,cy);ctx.lineTo(cx+12,cy);ctx.moveTo(cx,cy-12);ctx.lineTo(cx,cy+12);ctx.stroke()}}}
function worldAt(camX,camY,fn){ctx.save();ctx.translate(W/2-camX,H/2-camY);fn();ctx.restore()}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function glow(x,y,r,mid,outer='transparent'){let gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,mid);gr.addColorStop(1,outer);ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2)}
function character(p){let bob=Math.sin(p.steps)*((Math.abs(p.vx)+Math.abs(p.vy))>10?2.4:.8);ctx.save();ctx.translate(p.x,p.y+bob);if(p.invuln>0&&Math.floor(clock*16)%2===0)ctx.globalAlpha=.55;
ctx.fillStyle='#020b0b70';ctx.beginPath();ctx.ellipse(0,16,19,8,0,0,TAU);ctx.fill();glow(0,0,53,'#88dbab22');
ctx.rotate(Math.atan2(p.faceY,p.faceX)+Math.PI/2);
// The flowing cloak is animated independently of the movement.
ctx.fillStyle='#254c48';ctx.beginPath();ctx.moveTo(-12,1);ctx.quadraticCurveTo(-18,22,-16+Math.sin(clock*5)*3,29);ctx.quadraticCurveTo(0,22,16+Math.cos(clock*5)*3,29);ctx.quadraticCurveTo(18,18,12,1);ctx.closePath();ctx.fill();ctx.strokeStyle='#83b3a372';ctx.lineWidth=1.4;ctx.stroke();
// Boots and arms.
ctx.fillStyle='#26332f';ctx.fillRect(-10,7,7,13);ctx.fillRect(4,7,7,13);ctx.fillStyle='#f3d7ab';circle(-14,2,5,'#b09d73');circle(14,2,5,'#b09d73');
ctx.fillStyle='#b8c9aa';ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(10,-7);ctx.lineTo(12,12);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.fillStyle='#305c51';ctx.beginPath();ctx.moveTo(-9,-7);ctx.lineTo(0,-11);ctx.lineTo(9,-7);ctx.lineTo(7,11);ctx.lineTo(-7,11);ctx.closePath();ctx.fill();
// Face inside a gilt helm.
circle(0,-10,11,'#f6d7a5');ctx.fillStyle='#253c34';ctx.beginPath();ctx.moveTo(-12,-9);ctx.quadraticCurveTo(-8,-28,0,-26);ctx.quadraticCurveTo(10,-26,12,-9);ctx.lineTo(8,-13);ctx.lineTo(-8,-13);ctx.closePath();ctx.fill();ctx.strokeStyle='#e9d396';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-14);ctx.quadraticCurveTo(0,-19,8,-14);ctx.stroke();circle(0,-19,2.5,'#ffefc7');
// Magic staff/sword.
ctx.save();ctx.translate(13,-1);ctx.rotate(-.3+Math.sin(clock*5)*.09);ctx.strokeStyle='#9a8667';ctx.lineWidth=3.6;ctx.beginPath();ctx.moveTo(0,7);ctx.lineTo(0,-18);ctx.stroke();ctx.strokeStyle='#f3ead1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,-25);ctx.stroke();glow(0,-23,16,'#ffe6aa88');ctx.restore();ctx.restore()}
function enemySprite(e){ctx.save();ctx.translate(e.x,e.y+Math.sin(e.t*(e.type==='spark'?12:5))*(e.type==='boss'?1.7:2.5));let r=e.r;ctx.fillStyle='#020c0cb4';ctx.beginPath();ctx.ellipse(0,r*.68,r*1.05,r*.33,0,0,TAU);ctx.fill();if(e.type==='shade'){
ctx.fillStyle=e.flash?'#fff3cf':'#52665c';ctx.beginPath();ctx.moveTo(-r,0);ctx.quadraticCurveTo(-r,-r*.88,0,-r);ctx.quadraticCurveTo(r,-r*.9,r,1);ctx.lineTo(r*.8,r*.88);ctx.lineTo(r*.28,r*.68);ctx.lineTo(-r*.24,r*.9);ctx.lineTo(-r*.83,r*.72);ctx.closePath();ctx.fill();ctx.fillStyle='#273c34';ctx.beginPath();ctx.moveTo(-8,-7);ctx.lineTo(-r,-r-7);ctx.lineTo(-1,-r+3);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,-7);ctx.lineTo(r,-r-7);ctx.lineTo(2,-r+3);ctx.fill();circle(-5,-3,3.2,'#edce8d');circle(5,-3,3.2,'#edce8d');
}else if(e.type==='spark'){
ctx.fillStyle=e.flash?'#fff2df':'#a86f57';ctx.beginPath();for(let i=0;i<8;i++){let a=i*TAU/8+e.t*.2,rad=i%2===0?r*1.25:r*.7;i?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();circle(0,0,r*.59,'#e4b18d');circle(-4,-1,2.7,'#352a29');circle(4,-1,2.7,'#352a29');
}else if(e.type==='brute'){
ctx.fillStyle=e.flash?'#fff4c7':'#685b51';ctx.beginPath();ctx.moveTo(-r,-r*.25);ctx.lineTo(-r*.75,-r);ctx.lineTo(r*.75,-r);ctx.lineTo(r,-r*.25);ctx.lineTo(r*.7,r);ctx.lineTo(-r*.7,r);ctx.closePath();ctx.fill();ctx.fillStyle='#aa816c';ctx.beginPath();ctx.ellipse(0,0,r*.72,r*.85,0,0,TAU);ctx.fill();ctx.strokeStyle='#cfac82';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-r*.5,-r*.2);ctx.lineTo(0,r*.2);ctx.lineTo(r*.5,-r*.2);ctx.stroke();circle(0,0,6,'#f5cf90');
}else if(e.type==='sage'){
ctx.fillStyle=e.flash?'#fffaf1':'#789f9a';ctx.beginPath();ctx.moveTo(-r,.7*r);ctx.lineTo(-r*.63,-r*.25);ctx.lineTo(0,-r*1.3);ctx.lineTo(r*.63,-r*.25);ctx.lineTo(r,.7*r);ctx.closePath();ctx.fill();ctx.fillStyle='#304d54';ctx.beginPath();ctx.moveTo(-r*.5,-r*.25);ctx.lineTo(0,-r*.9);ctx.lineTo(r*.5,-r*.25);ctx.lineTo(0,r*.15);ctx.closePath();ctx.fill();circle(-5,0,3,'#d3f1ef');circle(5,0,3,'#d3f1ef');
}else{
let pulse=Math.sin(clock*2.6)*.5+.5;glow(0,0,95,`rgba(218,143,102,${.1+pulse*.06})`);ctx.save();ctx.rotate(e.t*.22);ctx.strokeStyle='#e2a77f88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+13,0,TAU);ctx.stroke();for(let i=0;i<7;i++){let a=i*TAU/7;circle(Math.cos(a)*(r+13),Math.sin(a)*(r+13),3,'#e4c58d')}ctx.restore();ctx.fillStyle=e.flash?'#fff3d2':'#665651';ctx.beginPath();ctx.moveTo(-r*.9,-r*.5);ctx.lineTo(-r*1.2,-r*1.2);ctx.lineTo(-r*.25,-r*.86);ctx.lineTo(0,-r*1.48);ctx.lineTo(r*.3,-r*.85);ctx.lineTo(r*1.18,-r*1.22);ctx.lineTo(r*.92,-r*.4);ctx.lineTo(r*.72,r*.85);ctx.lineTo(-r*.8,r*.85);ctx.closePath();ctx.fill();ctx.fillStyle='#a17a67';ctx.beginPath();ctx.ellipse(0,-1,r*.65,r*.86,0,0,TAU);ctx.fill();ctx.fillStyle='#221f21';ctx.fillRect(-r*.47,-r*.2,r*.94,r*.4);circle(-r*.24,-r*.05,5,'#f9c18a');circle(r*.24,-r*.05,5,'#f9c18a');glow(0,r*.1,27,'#ebad7770');if(e.actionTimer>0){ctx.strokeStyle=`rgba(255,145,119,${.4+.5*Math.sin(clock*17)**2})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,r+22+Math.sin(clock*10)*3,0,TAU);ctx.stroke()}}
ctx.restore();if(e.type==='boss'||e.type==='brute'){let ww=e.type==='boss'?96:42,xx=e.x-ww/2,yy=e.y-e.r-25;ctx.fillStyle='#1e1e22';ctx.fillRect(xx,yy,ww,5);ctx.fillStyle=e.type==='boss'?'#e1af83':'#cb9983';ctx.fillRect(xx,yy,ww*clamp(e.hp/e.maxHp,0,1),5);ctx.strokeStyle='#d4baa54f';ctx.strokeRect(xx,yy,ww,5)}}
function draw(dt){ctx.clearRect(0,0,W,H);const p=game?.player||{x:Math.sin(clock*.14)*32,y:Math.cos(clock*.19)*22,vx:0,vy:0,r:18,faceX:1,faceY:0,steps:clock*3,invuln:0,orbits:0};const camX=p.x,camY=p.y;ctx.save();if(shake&&game?.phase==='play')ctx.translate(random(-shake,shake),random(-shake,shake));ground(camX,camY);
// drifting dust, placed in screen-space for very cheap atmosphere
for(const a of ambient){let x=(a.x+clock*a.s*7)%W,y=(a.y-Math.sin(clock*.32+a.a)*12+H)%H;circle(x,y,1.1*a.s,'#c4dcb643')}
worldAt(camX,camY,()=>{
// An intricate glyph follows the guardian, grounding the animated arena visually.
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(clock*.045);ctx.strokeStyle='#d0b88018';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,116,0,TAU);ctx.stroke();for(let i=0;i<12;i++){let a=i*TAU/12;ctx.beginPath();ctx.moveTo(Math.cos(a)*109,Math.sin(a)*109);ctx.lineTo(Math.cos(a)*120,Math.sin(a)*120);ctx.stroke()}ctx.restore();
if(game){for(const b of game.enemyBullets){glow(b.x,b.y,18,'#d88d6f55');circle(b.x,b.y,b.r,'#f2b184');circle(b.x-2,b.y-2,b.r*.4,'#fff2de')}
for(const b of game.bullets){ctx.save();ctx.strokeStyle='#ffe7b388';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x,b.y);ctx.stroke();glow(b.x,b.y,20,'#f6d88f69');circle(b.x,b.y,b.r,'#fff3c8');ctx.restore()}
for(const e of game.enemies)enemySprite(e)}character(p);
if(p.orbits){for(let i=0;i<p.orbits;i++){let a=clock*2.8+i*TAU/p.orbits,x=p.x+Math.cos(a)*58,y=p.y+Math.sin(a)*58;glow(x,y,20,'#a7fbe26b');ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.fillStyle='#bdf8e6';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(9,0);ctx.lineTo(0,13);ctx.lineTo(-9,0);ctx.closePath();ctx.fill();ctx.restore()}}
for(const f of particles){ctx.globalAlpha=clamp(f.life/f.max,0,1);circle(f.x,f.y,f.r*f.life/f.max,f.color)}ctx.globalAlpha=1;for(const t of texts){ctx.save();ctx.globalAlpha=clamp(t.life/.8,0,1);ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#071517';ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);ctx.restore()}});
// warm and cool light from the environment, rather than saturated neon
let grd=ctx.createRadialGradient(W*.78,H*.1,10,W*.78,H*.1,Math.max(W,H)*.7);grd.addColorStop(0,'#e3c58a14');grd.addColorStop(1,'#06121a00');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);if(flash>0){ctx.globalAlpha=Math.min(.3,flash*.8);ctx.fillStyle='#fff0c4';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}ctx.restore()}
function loop(time){let dt=Math.min(.045,(time-last)/1000||.016);last=time;try{update(dt);draw(dt)}catch(err){console.error('MOONFALL game error',err);if(game?.phase==='play')pause()}requestAnimationFrame(loop)}
// -- Responsive touch controls, desktop keyboard and tap-to-move.
function setJoy(ev){let rect=$('joystick').getBoundingClientRect();let x=ev.clientX-(rect.left+rect.width/2),y=ev.clientY-(rect.top+rect.height/2),m=Math.min(1,Math.hypot(x,y)/(rect.width*.34));let n=normalize(x,y);inputs.joy.x=n.x*m;inputs.joy.y=n.y*m;$('stick').style.transform=`translate(calc(-50% + ${inputs.joy.x*36}px),calc(-50% + ${inputs.joy.y*36}px))`}
function resetJoy(){inputs.joy.x=0;inputs.joy.y=0;inputs.joy.id=null;$('stick').style.transform='translate(-50%,-50%)'}
const joy=$('joystick');joy.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!game||game.phase!=='play')return;inputs.joy.id=ev.pointerId;joy.setPointerCapture(ev.pointerId);setJoy(ev);inputs.target=null});joy.addEventListener('pointermove',ev=>{if(ev.pointerId===inputs.joy.id)setJoy(ev)});joy.addEventListener('pointerup',ev=>{if(ev.pointerId===inputs.joy.id)resetJoy()});joy.addEventListener('pointercancel',resetJoy);joy.addEventListener('lostpointercapture',resetJoy);
$('dashBtn').addEventListener('pointerdown',ev=>{ev.preventDefault();dash()});$('pauseBtn').addEventListener('click',pause);
canvas.addEventListener('pointerdown',ev=>{if(!game||game.phase!=='play')return;const r=canvas.getBoundingClientRect();let x=ev.clientX-r.left-W/2+game.player.x,y=ev.clientY-r.top-H/2+game.player.y;inputs.target={x,y};if(!inputs.joy.x&&!inputs.joy.y)toast('MOVING TO TARGET',.58)});
window.addEventListener('keydown',ev=>{const key=ev.key.length===1?ev.key.toLowerCase():ev.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(ev.key))ev.preventDefault();inputs.keys.add(key);if(ev.repeat)return;if(ev.code==='Space')dash();if(ev.key==='Escape'||ev.key==='p'||ev.key==='P'){if(game?.phase==='play')pause();else if(game?.phase==='pause')resume()}});
window.addEventListener('keyup',ev=>inputs.keys.delete(ev.key.length===1?ev.key.toLowerCase():ev.key));window.addEventListener('blur',()=>{inputs.keys.clear();resetJoy();if(game?.phase==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&game?.phase==='play')pause()});window.addEventListener('pagehide',persist);window.addEventListener('resize',resize);
const telegram=window.Telegram?.WebApp;if(telegram){try{telegram.ready();telegram.expand();if(typeof telegram.requestFullscreen==='function')telegram.requestFullscreen()}catch{}}
let snd=safeGet('gq_moonfall_sound');if(typeof snd==='boolean')sound=snd;resize();menu();requestAnimationFrame(loop);
})();
