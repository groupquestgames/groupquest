<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080c1b"><title>ORBIT MERGE · GroupQuest</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b19;color:#eff5ff;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;max-width:540px;margin:auto;background:radial-gradient(ellipse at 50% 0,#243363 0%,#10162c 42%,#080c1b 90%);position:relative}header{height:66px;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:10px;z-index:2}.brand{font-size:18px;font-weight:1000;letter-spacing:.4px}.brand b{color:#8beeff}.sub{font-size:9px;letter-spacing:2px;color:#95a6d5;font-weight:900}.scorebox{display:flex;gap:8px}.score{border:1px solid #ffffff24;background:#ffffff0e;border-radius:13px;padding:6px 13px;text-align:center;min-width:78px}.score small{display:block;font-size:9px;color:#aab6d5;letter-spacing:1px}.score strong{font-size:19px;font-variant-numeric:tabular-nums}.tools{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;gap:8px;z-index:2}.tools button,.modal button{border:1px solid #ffffff30;background:#ffffff12;color:white;border-radius:13px;padding:9px 12px;font-weight:800;cursor:pointer}.tools button:disabled{opacity:.35}.next{display:flex;align-items:center;gap:8px;font-size:11px;color:#aebde6;font-weight:800}.next span{width:28px;height:28px;border-radius:50%;display:inline-block;border:2px solid #ffffff55;box-shadow:inset -5px -5px 9px #0006,0 0 14px #ffffff24}.canvaswrap{position:relative;flex:1;min-height:0;margin:0 12px 8px;border:1px solid #8295dd4b;border-radius:23px;overflow:hidden;background:linear-gradient(#0c1731,#0c1025);box-shadow:inset 0 0 35px #0008,0 15px 35px #0005}canvas{display:block;width:100%;height:100%;touch-action:none}.tip{position:absolute;top:12px;left:0;right:0;text-align:center;pointer-events:none;color:#a6b8df;font-size:11px;letter-spacing:.3px;opacity:.9}.bottom{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;color:#9aaed7;font-size:11px;padding-bottom:env(safe-area-inset-bottom)}.bottom strong{color:#d4f5ff}.modalwrap{position:absolute;inset:0;background:#030612ba;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}.modal{border:1px solid #a6b6ff55;background:linear-gradient(155deg,#28376a,#141b39 70%);border-radius:26px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 25px 80px #0009}.modal .planet{font-size:57px;filter:drop-shadow(0 0 16px #8aefff88)}.modal h1{font-size:31px;line-height:1.05;margin:12px 0}.modal p{color:#b9c7e8;font-size:13px;line-height:1.6}.modal button.primary{background:linear-gradient(95deg,#73eaff,#a68dff,#ef86d8);color:#11172b;border:0;width:100%;font-size:15px;padding:15px;margin-top:12px}.modal .secondary{margin-top:8px;width:100%}.hide{display:none!important}.toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);pointer-events:none;color:#fff;font-weight:1000;font-size:19px;text-shadow:0 0 18px #8bfaff;opacity:0;transition:opacity .25s;z-index:4;white-space:nowrap}.toast.show{opacity:1}@media(max-height:650px){header{height:54px}.tools{padding-bottom:5px}.bottom{height:30px}}
</style></head><body><div id="app"><header><div><div class="sub">GROUPQUEST PRESENTS</div><div class="brand">ORBIT <b>MERGE</b> ✦</div></div><div class="scorebox"><div class="score"><small>SCORE</small><strong id="score">0</strong></div><div class="score"><small>BEST</small><strong id="best">0</strong></div></div></header><div class="tools"><div class="next">NEXT <span id="next"></span></div><button id="undo" title="Undo last drop">↶ UNDO <span id="undos">2</span></button><button id="sound" title="Toggle sound">♪ ON</button><button id="pause">Ⅱ</button></div><div class="canvaswrap" id="wrap"><canvas id="game"></canvas><div class="tip" id="tip">DRAG TO AIM · RELEASE TO DROP</div></div><div class="bottom">✦ Merge matching orbs · <strong>Don't cross the danger line</strong></div><div class="toast" id="toast"></div><div class="modalwrap" id="modal"><div class="modal"><div class="planet" id="modalIcon">🪐</div><h1 id="modalTitle">ORBIT MERGE</h1><p id="modalText">Drop matching orbs to fuse them into bigger worlds. Chain merges, chase your high score, and keep the chamber from overflowing.</p><button class="primary" id="primary">START PLAYING →</button><button class="secondary hide" id="secondary">RESTART</button></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');const $=id=>document.getElementById(id);const COLORS=['#5be5ff','#8c9bff','#b98aff','#f68cda','#ffab79','#ffdb75','#a5f5a0','#68e6c7','#ff728d','#fff1a0','#d9c2ff'];const LABEL=['·','✦','✧','◆','⬟','✿','✹','✪','✷','❖','★'];let W=340,H=540,scale=1,balls=[],particles=[],score=0,best=0,undos=2,history=[],current=0,next=1,aimX=170,aiming=false,active=false,paused=false,over=false,gameTime=0,dropWait=0,overflowTime=0,mergeCounter=0,soundOn=true,last=performance.now(),idCounter=0;const BASE=14,GRAV=1000,RESTITUTION=.13;let audio;try{best=Number(localStorage.getItem('orbit_merge_best')||0)}catch{}$('best').textContent=best;
function randLevel(){return Math.random()<.48?0:Math.random()<.7?1:2}function radius(level){return BASE*Math.pow(1.285,level)}function sound(freq=440,duration=.09,type='sine',vol=.08){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.72,audio.currentTime+duration);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function resize(){const r=wrap.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(200,r.height);scale=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);aimX=Math.max(radius(current)+5,Math.min(W-radius(current)-5,aimX));}window.addEventListener('resize',resize);resize();function hud(){$('score').textContent=score.toLocaleString();$('best').textContent=best.toLocaleString();$('undos').textContent=undos;$('undo').disabled=!active||paused||undos===0||history.length===0;$('next').style.background=COLORS[next]}
function showModal(title,text,button='PLAY',secondary=false,icon='🪐'){$('modalTitle').textContent=title;$('modalText').textContent=text;$('primary').textContent=button;$('secondary').classList.toggle('hide',!secondary);$('modalIcon').textContent=icon;$('modal').classList.remove('hide')}function hideModal(){$('modal').classList.add('hide')}
function reset(){balls=[];particles=[];score=0;undos=2;history=[];current=randLevel();next=randLevel();aimX=W/2;active=true;paused=false;over=false;gameTime=0;dropWait=0;overflowTime=0;mergeCounter=0;hud();hideModal();sound(600,.14)}
function drop(){if(!active||paused||over||dropWait>0)return;history.push({balls:balls.map(b=>({...b})),score,current,next,mergeCounter});if(history.length>4)history.shift();const r=radius(current);balls.push({id:++idCounter,x:Math.max(r+2,Math.min(W-r-2,aimX)),y:38,vx:0,vy:20,r,level:current,age:0,merged:false});current=next;next=randLevel();dropWait=.28;aiming=false;hud();sound(280,.09,'triangle',.055)}
function undo(){if(!active||paused||undos<=0||!history.length)return;const s=history.pop();balls=s.balls;score=s.score;current=s.current;next=s.next;mergeCounter=s.mergeCounter;undos--;overflowTime=0;hud();sound(500,.1)}
function spawnParticles(x,y,color){for(let i=0;i<13;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*160;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.3,color,r:2+Math.random()*3})}}
function merge(a,b){if(a.merged||b.merged||a.level!==b.level)return;const lvl=a.level+1,x=(a.x*a.r+b.x*b.r)/(a.r+b.r),y=(a.y+b.y)/2; a.merged=b.merged=true;const n={id:++idCounter,x,y,vx:(a.vx+b.vx)*.22,vy:-95,r:radius(lvl),level:lvl,age:0,merged:false};balls.push(n);let gain=Math.round(10*Math.pow(2,lvl));score+=gain;mergeCounter++;if(score>best){best=score;try{localStorage.setItem('orbit_merge_best',best)}catch{}}spawnParticles(x,y,COLORS[Math.min(lvl,COLORS.length-1)]);sound(300+lvl*70,.14,'sine',.09);if(mergeCounter%5===0)toast('✦ '+mergeCounter+' MERGES!');hud()}
let toastTimer=0;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');toastTimer=1.1}
function update(dt){if(!active||paused||over)return;gameTime+=dt;dropWait=Math.max(0,dropWait-dt);const steps=3,h=dt/steps;for(let k=0;k<steps;k++){for(const b of balls){b.age+=h;b.vy+=GRAV*h;b.vx*=.997;b.vy*=.999;b.x+=b.vx*h;b.y+=b.vy*h;if(b.x-b.r<4){b.x=b.r+4;b.vx=Math.abs(b.vx)*RESTITUTION}if(b.x+b.r>W-4){b.x=W-b.r-4;b.vx=-Math.abs(b.vx)*RESTITUTION}if(b.y+b.r>H-5){b.y=H-b.r-5;b.vy=-Math.abs(b.vy)*RESTITUTION;b.vx*=.965}}let pending=null;for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.merged||b.merged)continue;let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.0001,min=a.r+b.r;if(dist>=min)continue;if(a.level===b.level&&a.age>.12&&b.age>.12){pending=[a,b];break}const nx=dx/dist,ny=dy/dist,overlap=min-dist;let move=overlap*.51;a.x-=nx*move;a.y-=ny*move;b.x+=nx*move;b.y+=ny*move;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const impulse=-(1+RESTITUTION)*rv*.5;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}if(pending){merge(...pending);balls=balls.filter(b=>!b.merged)}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=130*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}
// Only settled balls above the warning line can end a run; a newly dropped orb is ignored.
const danger=balls.some(b=>b.age>2.5&&b.y-b.r<86&&Math.hypot(b.vx,b.vy)<95);overflowTime=danger?overflowTime+dt:Math.max(0,overflowTime-dt*1.5);if(overflowTime>2.6){active=false;over=true;sound(180,.35,'sawtooth',.05);showModal('CHAMBER FULL','You scored '+score.toLocaleString()+' points. Best: '+best.toLocaleString()+'. One more run?', 'TRY AGAIN →',true,'💫')}}
function drawBall(b,alpha=1){const c=COLORS[Math.min(b.level,COLORS.length-1)];ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=c;ctx.shadowBlur=16;let g=ctx.createRadialGradient(b.x-b.r*.34,b.y-b.r*.42,1,b.x,b.y,b.r);g.addColorStop(0,'#ffffff');g.addColorStop(.12,c);g.addColorStop(.72,c);g.addColorStop(1,'#172144');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff88';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#0d1533aa';ctx.font=`900 ${Math.max(11,b.r*.83)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(LABEL[Math.min(b.level,LABEL.length-1)],b.x,b.y+1);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#152044');bg.addColorStop(1,'#080e21');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff07';ctx.lineWidth=1;for(let x=22;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=20;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.save();ctx.setLineDash([9,8]);ctx.strokeStyle=overflowTime>0?'#ff6c8f':'#ff829b88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,86);ctx.lineTo(W,86);ctx.stroke();ctx.restore();ctx.fillStyle='#ff91ab99';ctx.font='800 9px system-ui';ctx.textAlign='left';ctx.fillText('DANGER ZONE',10,80);ctx.fillStyle='#84e9ff55';ctx.fillRect(0,H-6,W,6);for(const b of balls)drawBall(b);if(active&&!paused){const r=radius(current);let x=Math.max(r+4,Math.min(W-r-4,aimX));ctx.save();ctx.strokeStyle='#ffffff4d';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(x,38);ctx.lineTo(x,H-8);ctx.stroke();ctx.restore();drawBall({x,y:38,r,level:current},.85)}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(paused){ctx.fillStyle='#060a1ac0';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 27px system-ui';ctx.fillText('PAUSED',W/2,H/2)}}
function tick(now){let dt=Math.min((now-last)/1000,.033);last=now;update(dt);render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function pos(e){const r=canvas.getBoundingClientRect();aimX=Math.max(radius(current)+5,Math.min(W-radius(current)-5,e.clientX-r.left))}canvas.addEventListener('pointerdown',e=>{if(!active||paused)return;aiming=true;pos(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(aiming)pos(e)});canvas.addEventListener('pointerup',e=>{if(aiming){pos(e);drop()}aiming=false});canvas.addEventListener('pointercancel',()=>aiming=false);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){togglePause();return}if(!active||paused)return;if(e.key==='ArrowLeft')aimX=Math.max(radius(current)+5,aimX-25);if(e.key==='ArrowRight')aimX=Math.min(W-radius(current)-5,aimX+25);if(e.key===' '||e.key==='Enter'){e.preventDefault();drop()}if(e.key.toLowerCase()==='z')undo()});function togglePause(){if(!active)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';hud()}
$('undo').onclick=undo;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♪ ON':'♪ OFF';if(soundOn)sound(500,.07)};$('pause').onclick=togglePause;$('primary').onclick=()=>{reset();$('pause').textContent='Ⅱ'};$('secondary').onclick=()=>reset();hud();document.addEventListener('visibilitychange',()=>{if(document.hidden&&active&&!paused)togglePause()});
})();</script></body></html>
